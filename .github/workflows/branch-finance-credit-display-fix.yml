name: Branch Finance Credit Display Fix

on:
  push:
    branches:
      - fix/branch-finance-credit-display

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/branch-finance-credit-display
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply finance display patch
        run: node scripts/applyBranchFinanceCreditDisplayFix.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run focused regression tests
        run: node --import tsx --test tests/finance-branch-credit-display.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Diff safety check
        run: git diff --check

      - name: Guard scope
        shell: bash
        run: |
          changed=$(git diff --name-only HEAD -- src/pages/Finance.tsx tests/finance-branch-credit-display.test.ts)
          echo "$changed"
          test -n "$changed"
          prohibited=$(git diff --name-only HEAD | grep -E 'src/services/pos-v2|src/services/posCheckoutTierService.ts|src/services/posTierCartService.ts|firestore.rules|scripts/process-pos-v2-outbox.mjs' || true)
          if [ -n "$prohibited" ]; then
            echo "Protected files changed unexpectedly:"
            echo "$prohibited"
            exit 1
          fi

      - name: Finalize branch without temporary automation files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Finance.tsx tests/finance-branch-credit-display.test.ts
          git rm scripts/applyBranchFinanceCreditDisplayFix.mjs .github/workflows/branch-finance-credit-display-fix.yml .branch-finance-fix-trigger
          git commit -m "fix: correct Branch Finance credit display"
          git push origin HEAD:fix/branch-finance-credit-display
