name: POS V2 Foundation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/services/pos-v2/**'
      - 'scripts/pos-v2-batch4-core.mjs'
      - 'scripts/process-pos-v2-outbox.mjs'
      - 'scripts/verify-active-firestore-rules.sh'
      - 'tests/pos-checkout-v2-*.test.ts'
      - 'tests/firebase-deploy-rules-drift.test.ts'
      - 'src/services/posCheckoutTierService.ts'
      - 'src/services/sellingTierService.ts'
      - 'src/types.ts'
      - 'src/types/sellingTier.ts'
      - 'firestore.rules'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pos-v2-foundation-ci.yml'
      - '.github/workflows/pos-v2-batch4-outbox.yml'
      - '.github/workflows/firebase-deploy.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build
