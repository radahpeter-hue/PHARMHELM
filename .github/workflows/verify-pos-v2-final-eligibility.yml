name: Verify POS V2 Final Eligibility

on:
  push:
    branches:
      - fix/pos-v2-eligibility-final

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply deterministic correction
        shell: bash
        run: |
          git show 2b1594633d8bba4a3dda243f8e82f74448ce75a8:.github/workflows/apply-pos-v2-final-eligibility.yml \
            | sed -n "/python <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/apply-final-eligibility.py
          test -s /tmp/apply-final-eligibility.py
          python <<'PY'
          from pathlib import Path
          path = Path('firestore.rules')
          text = path.read_text()
          products_marker = '    match /products/{productId} {'
          batches_marker = '    match /product_batches/{batchId} {'
          before_products, remainder = text.split(products_marker, 1)
          products_block, after_products = remainder.split(batches_marker, 1)
          anchor = "          isInventoryOperator() ||\n          (isPOSOperator()"
          if products_block.count(anchor) != 1:
              raise SystemExit('Expected one POS aggregate rule anchor in products block.')
          products_block = products_block.replace(
              anchor,
              "          isInventoryOperator() ||\n          // TEMP_FINAL_ELIGIBILITY_PATCH_GUARD\n          (isPOSOperator()",
              1
          )
          path.write_text(before_products + products_marker + products_block + batches_marker + after_products)
          PY
          python /tmp/apply-final-eligibility.py
          python <<'PY'
          from pathlib import Path
          path = Path('firestore.rules')
          text = path.read_text()
          guard = '          // TEMP_FINAL_ELIGIBILITY_PATCH_GUARD\n'
          if text.count(guard) != 1:
              raise SystemExit('Temporary rules patch guard was not preserved exactly once.')
          path.write_text(text.replace(guard, '', 1))
          PY
      - name: Test
        run: npm test
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff validation
        run: git diff --check
      - name: Commit verified correction
        shell: bash
        run: |
          rm .github/workflows/verify-pos-v2-final-eligibility.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: align POS eligibility with batch authority [final-eligibility-applied]'
          git push origin HEAD:fix/pos-v2-eligibility-final
