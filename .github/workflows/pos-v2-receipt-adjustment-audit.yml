name: POS V2 Receipt Adjustment Audit
on:
  push:
    branches: ['fix/receipt-reference-module-audit']
    paths:
      - 'scripts/audit-pos-v2-receipt-adjustment.mjs'
      - '.github/workflows/pos-v2-receipt-adjustment-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --ignore-scripts firebase-admin
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - name: Verify the confirmed receipt adjustment across modules without writes
        run: node scripts/audit-pos-v2-receipt-adjustment.mjs
