name: Phase 2 Context Validation Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/pages/Sales.tsx'
      - 'src/utils/saleContextValidation.ts'
      - 'tests/pos-phase2-context-validation.test.ts'
      - 'docs/POS_V2_PHASE2_CONTEXT_VALIDATION_REPORT.md'
      - 'scripts/applyPhase2ContextValidation.mjs'
      - '.github/workflows/phase2-patch.yml'

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/pos-v2-phase2-context-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply surgical Sales wiring
        run: node scripts/applyPhase2ContextValidation.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run targeted Phase 2 tests
        run: node --import tsx --test tests/pos-phase2-context-validation.test.ts

      - name: Run complete test suite
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run production build
        run: npm run build

      - name: Run git diff check
        run: git diff --check

      - name: Prove protected core is untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          changed=$( { git diff --name-only origin/main...HEAD; git diff --name-only; } | sort -u )
          echo "$changed"
          protected='^(src/services/pos-v2/posCheckoutV2Repository.ts|src/services/pos-v2/posCheckoutV2Calculator.ts|src/services/pos-v2/posCheckoutV2Service.ts|src/services/posCheckoutTierService.ts|src/services/posTierCartService.ts|firestore.rules)$'
          if printf '%s\n' "$changed" | grep -E "$protected"; then
            echo 'Protected POS V2 transaction core or Firestore rules were modified.' >&2
            exit 1
          fi

      - name: Finalize branch with only Phase 2 product changes
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/applyPhase2ContextValidation.mjs
          rm .github/workflows/phase2-patch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Sales.tsx scripts/applyPhase2ContextValidation.mjs .github/workflows/phase2-patch.yml
          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git commit -m 'fix: wire POS context validation before checkout'
          git push origin HEAD:fix/pos-v2-phase2-context-validation
