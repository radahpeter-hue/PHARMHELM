name: Firestore compiled release size
on:
  pull_request:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'scripts/build-firestore-release-rules.mjs'
      - 'scripts/validate-inactive-finance-rules.mjs'
      - 'scripts/firestore-unbound-probe.mjs'
      - 'scripts/diagnose-firestore-compiler.mjs'
      - '.github/workflows/firestore-release-size.yml'
permissions:
  contents: read
jobs:
  activation-size:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compile compact equivalent rule symbols
        run: node scripts/build-firestore-release-rules.mjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - run: npm install --no-save --package-lock=false --ignore-scripts firebase-tools@15.4.0
      - name: Require actual compiled executable to fit the activation limit
        id: candidate
        run: |
          node scripts/validate-inactive-finance-rules.mjs
      - name: Diagnose compiler failure against deny-all and exact PR base controls
        if: failure() && steps.candidate.outcome == 'failure'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:firestore.rules" > /tmp/main-control.rules
          git show "$BASE_SHA:scripts/build-firestore-release-rules.mjs" > /tmp/main-control-build.mjs
          node /tmp/main-control-build.mjs /tmp/main-control.rules
          git show HEAD:firestore.rules > /tmp/authored-candidate.rules
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {compactRuleSymbols,wrapReleaseColumns,RELEASE_RULE_OPTIONS} from './scripts/build-firestore-release-rules.mjs';
          const source=readFileSync('/tmp/authored-candidate.rules','utf8');
          const release=RELEASE_RULE_OPTIONS;
          const variants={
            noVector:{...release,vectorEquality:false},
            indexedFields:{...release,indexedFields:true},
            noFields:{...release,fieldReaders:false},
            noEarlyRequests:{...release,earlyRequests:false},
          };
          for(const [name,options] of Object.entries(variants)) writeFileSync(`/tmp/${name}.rules`,wrapReleaseColumns(compactRuleSymbols(source,options))+'\n');
          JS
          node scripts/diagnose-firestore-compiler.mjs /tmp/main-control.rules /tmp/noVector.rules /tmp/noFields.rules /tmp/noEarlyRequests.rules /tmp/indexedFields.rules
