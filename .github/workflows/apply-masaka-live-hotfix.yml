name: Masaka Hotfix Verifier

on:
  push:
    branches:
      - fix/masaka-pos-v2-live-failures

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Align live patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_masaka_live_hotfix.py')
          text = p.read_text()
          text = text.replace('errorMessage: null', 'lastError: null')
          old = '"                          </div>\\n                        </td>\\n                      </tr>",\n    "                            </div>\\n                          )}\\n                        </td>\\n                      </tr>",'
          new = '"                              <Trash2 size={16} />\\n                            </button>\\n                          </div>\\n                        </td>\\n                      </tr>",\n    "                              <Trash2 size={16} />\\n                            </button>\\n                            </div>\\n                          )}\\n                        </td>\\n                      </tr>",'
          if old not in text:
              raise SystemExit('Inventory action patch anchor definition not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - run: python3 scripts/apply_masaka_live_hotfix.py
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply_masaka_live_hotfix.py
          rm -f .github/workflows/apply-masaka-live-hotfix.yml
          rm -f .github/workflows/apply-masaka-live-hotfix-v2.yml
          git add -A
          git commit -m "fix: harden Masaka POS and inventory live flows"
          git push origin HEAD:fix/masaka-pos-v2-live-failures
