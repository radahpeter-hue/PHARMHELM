name: Finance Level 4 validation
on:
  pull_request:
    paths:
      - 'src/pages/Finance.tsx'
      - 'src/pages/finance/management/CashAndBanking.tsx'
      - 'tests/treasury*.test.ts'
      - 'tests/finance-rebuild-level3-audit.test.ts'
      - 'tests/portfolio*.test.ts'
      - 'tests/authoritative-portfolio-ledger.test.ts'
      - 'tests/credit-receivables*.test.ts'
      - 'src/services/managementCashPosting.ts'
      - 'src/services/managementPaymentAccountService.ts'
      - 'src/domain/finance/**'
      - 'src/components/finance/**'
      - 'src/services/financePortfolio*'
      - 'tests/financial-portfolio*.test.ts'
      - 'tests/eod-portfolio-routing.test.ts'
      - 'scripts/eod-portfolio-settlement-emulator.mjs'
      - 'scripts/portfolio-transfer-emulator.mjs'
      - 'scripts/cash-outflows-emulator.mjs'
      - 'src/services/eodSubmissionService.ts'
      - 'src/services/eodCorrectionService.ts'
      - 'scripts/eod-automatic-posting-emulator.mjs'
      - 'scripts/portfolio-release-ui-smoke.mjs'
      - 'firestore.rules'
      - 'scripts/build-firestore-release-rules.mjs'
      - '.github/workflows/finance-level4-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Generate exact equivalent release Rules before emulator acceptance
        run: node scripts/build-firestore-release-rules.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --package-lock=false --ignore-scripts firebase-tools@15.4.0
      - name: CEO-only and tenant-isolated portfolio security tests
        run: npx firebase emulators:exec --only firestore --project pharmhelm-finance-l4-portfolio-test "node scripts/finance-level4-rules-emulator.mjs"
      - name: Authenticated atomic EOD portfolio settlement and replay acceptance
        run: npx firebase emulators:exec --only firestore --project pharmhelm-eod-posting-acceptance "node --import tsx scripts/eod-portfolio-settlement-emulator.mjs"
      - name: Automatic branch EOD portfolio posting acceptance
        run: npx firebase emulators:exec --only firestore --project pharmhelm-eod-auto-test "node --import tsx scripts/eod-automatic-posting-emulator.mjs"
      - name: Level 5 authenticated Bank-to-Bank transfer checkpoint
        run: npx firebase emulators:exec --only firestore --project pharmhelm-level5-bank-transfer-test "node --import tsx scripts/portfolio-transfer-emulator.mjs"
      - name: Authenticated branch and HQ cash outflow acceptance
        run: npx firebase emulators:exec --only firestore --project pharmhelm-cash-outflows-test "node --import tsx scripts/cash-outflows-emulator.mjs"
      - name: Install portfolio verification browser
        run: |
          npm install --prefix /tmp/portfolio-browser --no-save playwright@1.51.1
          /tmp/portfolio-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Portfolio ledgers on phone and desktop
        env:
          PLAYWRIGHT_MODULE: /tmp/portfolio-browser/node_modules/playwright
        run: node scripts/portfolio-release-ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-release-ui-proof
          path: /tmp/portfolio-release-ui-*/*.png
