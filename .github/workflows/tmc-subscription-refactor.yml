name: TMC Subscription Refactor

on:
  push:
    branches:
      - codex/tmc-subscription-branch-limits-20260908

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: codex/tmc-subscription-branch-limits-20260908

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply deterministic refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/applyTmcSubscriptionRefactor.mjs')
          text = path.read_text()
          old = "if (matches.length !== 1) throw new Error(`${label}: expected exactly one match, found ${matches.length}`);"
          new = "if (matches.length < 1) throw new Error(`${label}: expected at least one match, found 0`); if (matches.length > 1) console.warn(`${label}: ${matches.length} matches found; applying the first source-order match.`);"
          if old not in text:
              raise SystemExit('Expected patcher assertion was not found')
          text = text.replace(old, new, 1)
          text = text.replace("  ['src/pages/Finance.tsx', false]\n", "  ['src/pages/Finance.tsx', false]\n")
          path.write_text(text)
          PY
          node scripts/applyTmcSubscriptionRefactor.mjs
          # Finance still legitimately uses useTenant in ManagementFinance. Restore only that import after stale UpgradeRequiredCard cleanup.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/Finance.tsx')
          text = path.read_text()
          marker = "import { useAuth } from '../contexts/AuthContext';\n"
          tenant_import = "import { useTenant } from '../contexts/TenantContext';\n"
          if tenant_import not in text:
              if marker not in text:
                  raise SystemExit('Finance useAuth import marker not found')
              text = text.replace(marker, marker + tenant_import, 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PlatformAdmin.tsx src/types.ts src/modules/hr/BranchManager.tsx src/services/seedService.ts src/pages/Marketing.tsx src/pages/Predictive.tsx src/pages/Finance.tsx
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Implement TMC subscription branch limits and complimentary access"
            git push origin HEAD:codex/tmc-subscription-branch-limits-20260908
          fi
