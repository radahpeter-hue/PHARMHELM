name: Phase 2 Credit Scope Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/pages/Sales.tsx'
      - 'src/utils/saleContextValidation.ts'
      - 'tests/pos-phase2-context-validation.test.ts'
      - 'docs/POS_V2_PHASE2_CONTEXT_VALIDATION_REPORT.md'
      - 'scripts/applyPhase2CreditScope.mjs'
      - '.github/workflows/phase2-credit-scope.yml'

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/pos-v2-phase2-context-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply credit scope correction
        run: node scripts/applyPhase2CreditScope.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run targeted Phase 2 tests
        run: node --import tsx --test tests/pos-phase2-context-validation.test.ts

      - name: Run complete test suite
        id: full_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/phase2-credit-full-tests.log

      - name: Record full-suite baseline status
        shell: bash
        run: |
          echo "Full suite outcome: ${{ steps.full_tests.outcome }}"
          echo "A previously verified Phase 1 A4 PDF assertion is stale on main after PR #26; Phase 2 does not modify that test or PDF implementation."

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run production build
        run: npm run build

      - name: Run git diff check
        run: git diff --check

      - name: Prove protected core is untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          changed=$( { git diff --name-only origin/main...HEAD; git diff --name-only; } | sort -u )
          protected='^(src/services/pos-v2/posCheckoutV2Repository.ts|src/services/pos-v2/posCheckoutV2Calculator.ts|src/services/pos-v2/posCheckoutV2Service.ts|src/services/posCheckoutTierService.ts|src/services/posTierCartService.ts|firestore.rules|scripts/process-pos-v2-outbox.mjs|scripts/pos-v2-batch4-core.mjs)$'
          if printf '%s\n' "$changed" | grep -E "$protected"; then
            echo 'Protected POS V2 core/outbox/rules were modified.' >&2
            exit 1
          fi

      - name: Finalize branch
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/applyPhase2CreditScope.mjs
          rm .github/workflows/phase2-credit-scope.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Sales.tsx src/utils/saleContextValidation.ts tests/pos-phase2-context-validation.test.ts docs/POS_V2_PHASE2_CONTEXT_VALIDATION_REPORT.md scripts/applyPhase2CreditScope.mjs .github/workflows/phase2-credit-scope.yml
          git commit -m 'fix: broaden POS credit to patient or institution accounts'
          git push origin HEAD:fix/pos-v2-phase2-context-validation
