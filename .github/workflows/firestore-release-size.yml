name: Firestore compiled release size
on:
  pull_request:
    branches:
      - main
      - 'feature/finance-v2-phase5-hr-advance-validation-20261021'
      - 'feature/finance-v2-phase6-credit-20261026'
    paths:
      - 'docs/FINANCE_V2_PHASE6_ACCEPTANCE.md'
      - 'src/components/finance/ReceivablesRegister.tsx'
      - 'scripts/phase6-*.mjs'
      - 'firestore.rules'
      - 'scripts/build-firestore-release-rules.mjs'
      - 'scripts/validate-inactive-finance-rules.mjs'
      - 'scripts/firebase-rules-diagnostics.mjs'
      - 'scripts/build-firestore-compiler-controls.mjs'
      - 'tests/firestore-size-probe.test.ts'
      - 'tests/firebase-rules-diagnostics.test.ts'
      - '.github/workflows/firestore-release-size.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activation-size:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile compact equivalent rule symbols
        run: |
          cp firestore.rules /tmp/phase5-authored.rules
          node scripts/build-firestore-compiler-controls.mjs firestore.rules /tmp/phase5-compiler-controls
          node scripts/build-firestore-release-rules.mjs
      - name: Read independently certified compiler control
        uses: actions/checkout@v4
        with:
          ref: c542ce834a60b0a21a9ea278b9dd90ab60fd8a17
          path: .phase5-certified-baseline
      - name: Build exact certified control rules
        run: |
          node .phase5-certified-baseline/scripts/build-firestore-release-rules.mjs .phase5-certified-baseline/firestore.rules
          echo '5162b4f375af5a9cc288a3502659e3e7833bf1fcf7c6bd4e35e20cce2fae40ad  .phase5-certified-baseline/firestore.rules' | sha256sum --check
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - run: npm install --prefix /tmp/rules-size --no-save --ignore-scripts google-auth-library
      - name: Require actual compiled executable to fit the activation limit
        id: candidate_size
        env:
          PHARMHELM_COMPILER_BASELINE_RULES: .phase5-certified-baseline/firestore.rules
          PHARMHELM_COMPILER_AUTHORED_RULES: /tmp/phase5-authored.rules
          PHARMHELM_COMPILER_CONTROLS: /tmp/phase5-compiler-controls
          PHARMHELM_ENABLE_RELEASE_CONTROLS: '1'
          PHARMHELM_VERDICT_OUTPUT_FILE: /tmp/rules-size/verdict.json
        run: |
          cp scripts/validate-inactive-finance-rules.mjs /tmp/rules-size/validate.mjs
          cp scripts/firebase-rules-diagnostics.mjs /tmp/rules-size/firebase-rules-diagnostics.mjs
          node /tmp/rules-size/validate.mjs
      # Same source and strict verifier, changing only filename metadata. Runs only
      # when canonical validation failed and can never override the mandatory gate.
      - name: Compare run-labelled source filename without production activation
        if: failure() && steps.candidate_size.outcome == 'failure'
        continue-on-error: true
        env:
          PHARMHELM_COMPILER_FILE_NAME_MODE: unique
        run: GITHUB_RUN_ID="${GITHUB_RUN_ID}01" node /tmp/rules-size/validate.mjs
      - name: Diagnose a minimal actual unbound release
        if: failure() && steps.candidate_size.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "DIAGNOSTIC_ONLY_MINIMAL_UNBOUND_RELEASE"
          printf '%s\n' "rules_version = '2'; service cloud.firestore { match /databases/{database}/documents { match /{document=**} { allow read, write: if false; } } }" > /tmp/minimal-control.rules
          GITHUB_RUN_ID="${GITHUB_RUN_ID}02" node /tmp/rules-size/validate.mjs /tmp/minimal-control.rules
      # Diagnostic only: the failed candidate step continues to fail this job.
      # Use a distinct owned operation so no candidate probe is reused.
      - name: Diagnose the exact signed-off Phase 5 activation control
        if: failure() && steps.candidate_size.outcome == 'failure'
        continue-on-error: true
        run: GITHUB_RUN_ID="${GITHUB_RUN_ID}00" node /tmp/rules-size/validate.mjs .phase5-certified-baseline/firestore.rules
      - name: Publish structured Firestore Rules validation verdict
        if: always()
        run: |
          if [ -f /tmp/rules-size/verdict.json ]; then
            cat /tmp/rules-size/verdict.json
            {
              echo "### Authoritative Firestore Rules Release-Size Gate"
              echo '```json'
              cat /tmp/rules-size/verdict.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
