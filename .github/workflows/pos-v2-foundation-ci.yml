name: POS V2 Foundation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/services/pos-v2/**'
      - 'src/components/sales/PosV2ReceiptRevision*.tsx'
      - 'src/components/sales/usePosV2RevisionCatalogData.ts'
      - 'src/components/sales/A4InvoiceTemplate.tsx'
      - 'src/components/ThreeCapsule.tsx'
      - 'src/pages/Sales.tsx'
      - 'src/services/invoicePdfExportService.ts'
      - 'src/utils/receiptPrinting.ts'
      - 'src/utils/salePresentation.ts'
      - 'src/utils/excelExport.ts'
      - 'src/pages/finance/management/**'
      - 'scripts/pos-v2-consumer-posting.mjs'
      - 'scripts/pos-v2-spark-*.mjs'
      - 'scripts/run-pos-v2-spark-emulator.mjs'
      - 'scripts/pos-v2-batch4-core.mjs'
      - 'scripts/process-pos-v2-outbox.mjs'
      - 'scripts/pos-v2-revision-*.mjs'
      - 'scripts/process-pos-v2-revision*.mjs'
      - 'scripts/verify-active-firestore-rules.sh'
      - 'scripts/verify-pos-v2-revision-indexes.mjs'
      - 'tests/pos-checkout-v2-*.test.ts'
      - 'tests/pos-v2-revision-*.test.ts'
      - 'tests/pos-phase1-ui-docs.test.ts'
      - 'tests/sale-presentation.test.ts'
      - 'tests/excelExport.test.ts'
      - 'tests/three-capsule-fallback.test.ts'
      - 'tests/firebase-deploy-rules-drift.test.ts'
      - 'src/services/posCheckoutTierService.ts'
      - 'src/services/sellingTierService.ts'
      - 'src/components/inventory/OperationalInventoryTab.tsx'
      - 'src/components/procurement/**'
      - 'src/hooks/useOperationalInventoryFeature.ts'
      - 'src/services/operational*.ts'
      - 'src/services/supplierRegistry*.ts'
      - 'src/pages/Clients.tsx'
      - 'scripts/supplier-registry-rules-emulator.mjs'
      - 'tests/supplier-registry.test.ts'
      - 'src/services/orderSubmissionService.ts'
      - 'src/services/procurementFinanceService.ts'
      - 'src/services/centralGrnFinanceContract.ts'
      - 'src/services/grnDispatchService.ts'
      - 'tests/grn-prepared-dispatch.test.ts'
      - 'src/services/cashGrnSettlement*.ts'
      - 'tests/cash-grn-settlement.test.ts'
      - 'tests/central-grn-finance-contract.test.ts'
      - 'tests/procurement-grn-cash-draft.test.ts'
      - 'scripts/procurement-grn-cash-draft-rules-emulator.mjs'
      - 'src/services/procurementApproval*.ts'
      - 'scripts/procurement-approval-rules-emulator.mjs'
      - 'tests/procurement-approval-substitutions.test.ts'
      - 'src/pages/Inventory.tsx'
      - 'src/pages/Procurement.tsx'
      - 'src/pages/Settings.tsx'
      - 'src/pages/StockInOut.tsx'
      - 'scripts/operational-inventory*.mjs'
      - 'scripts/auto-order-atomic-rules-emulator.mjs'
      - 'scripts/system-identity-rules-emulator.mjs'
      - 'scripts/identity-backfill-preview.mjs'
      - 'scripts/audit-system-identities.mjs'
      - 'scripts/initialize-identity-counters.mjs'
      - 'scripts/martin-pharma-identity-staging-emulator.mjs'
      - 'tests/system-identity-*.test.ts'
      - 'src/services/systemIdentityService.ts'
      - 'scripts/migrate-operational-inventory-v2.mjs'
      - 'tests/operational-*.test.ts'
      - 'src/types.ts'
      - 'src/types/sellingTier.ts'
      - 'firestore.rules'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pos-v2-foundation-ci.yml'
      - '.github/workflows/pos-v2-batch4-outbox.yml'
      - '.github/workflows/pos-v2-revision-lifecycle.yml'
      - '.github/workflows/firebase-deploy.yml'

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Run tests
        run: npm test

      - name: Set up Java for Spark transaction integration tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test Spark corrections against Firestore rules
        run: |
          npm install --no-save --ignore-scripts firebase-admin
          node scripts/run-pos-v2-spark-emulator.mjs

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Set up Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Firestore rules test runtime
        run: npm install --no-save --package-lock=false --ignore-scripts firebase-tools@15.4.0 @firebase/rules-unit-testing@5.0.0

      - name: Enforce POS revision RBAC in Firestore emulator
        run: npx firebase emulators:exec --only firestore --project pharmhelm-pos-v2-revision-rbac "node scripts/pos-v2-revision-rbac-rules-emulator.mjs"

      - name: Enforce Operational Inventory class and branch boundaries in Firestore emulator
        run: npx firebase emulators:exec --only firestore --project pharmhelm-operational-inventory-v2-rules "node scripts/operational-inventory-rules-emulator.mjs && node scripts/operational-manual-order-regression.mjs && node scripts/auto-order-atomic-rules-emulator.mjs && node scripts/procurement-approval-rules-emulator.mjs && node scripts/procurement-grn-cash-draft-rules-emulator.mjs && node scripts/supplier-registry-rules-emulator.mjs && node scripts/system-identity-rules-emulator.mjs && node scripts/martin-pharma-identity-staging-emulator.mjs" && touch /tmp/pharmhelm-firestore-emulator-passed

      - name: Authenticate for hosted Firestore rules compilation
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Audit live named Firestore identity codes (read only)
        env:
          GOOGLE_CLOUD_PROJECT: gen-lang-client-0911422817
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts firebase-admin
          node scripts/audit-system-identities.mjs /tmp/pharmhelm-identity-audit-summary.json

      - name: Upload identity audit summary (no patient or staff details)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmhelm-identity-audit-summary
          path: /tmp/pharmhelm-identity-audit-summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate rules with the hosted Firebase compiler
        shell: bash
        env:
          FIREBASE_PROJECT_ID: gen-lang-client-0911422817
          FIRESTORE_DATABASE_ID: ai-studio-f7d8654b-e089-425a-a506-38159afe1e75
        run: |
          set -euo pipefail

          access_token=$(gcloud auth application-default print-access-token)

          test_rules_file() {
            local label="$1"
            local file="$2"
            local body_file response_file http_status errors
            response_file=$(mktemp)
            body_file=$(mktemp)
            jq -n --rawfile rules "$file" \
              '{source: {files: [{name: "firestore.rules", content: $rules}]}}' \
              > "$body_file"

            http_status=$(curl --silent --show-error \
              -o "$response_file" \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${access_token}" \
              -H "Content-Type: application/json" \
              --data-binary "@${body_file}" \
              "https://firebaserules.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}:test")

            compiler_status="$http_status"
            echo "${label} compiler response: HTTP ${http_status}"
            if [ "$http_status" != "200" ]; then
              jq . "$response_file" 2>/dev/null || cat "$response_file"
              return 1
            fi

            errors=$(jq '[.issues[]? | select(.severity == "ERROR")] | length' "$response_file")
            if [ "$errors" -ne 0 ]; then
              jq . "$response_file"
              return 1
            fi
          }

          cat > /tmp/minimal-firestore.rules <<'RULES'
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              match /{document=**} {
                allow read, write: if false;
              }
            }
          }
          RULES

          if ! test_rules_file "Minimal deny-all control" /tmp/minimal-firestore.rules; then
            echo "::error title=Firebase Rules API control failure::The hosted compiler rejected a minimal deny-all ruleset, so this failure cannot be attributed to PharmHelm rule complexity alone."
            exit 2
          fi

          if ! test_rules_file "PharmHelm candidate" firestore.rules; then
            if [ "$compiler_status" = "503" ] && [ -f /tmp/pharmhelm-firestore-emulator-passed ]; then
              echo "::warning title=Hosted rules compiler unavailable::Candidate compilation returned HTTP 503, but the exact candidate rules loaded and passed the POS RBAC and Operational Inventory Firestore emulator suites."
            elif [ "$compiler_status" = "503" ] && bash scripts/verify-active-firestore-rules.sh; then
              echo "::warning title=Firebase compiler unavailable::Candidate compilation returned HTTP 503. Exact active named-database rules content verified; this commit introduces no rules change."
            else
              echo "::error title=PharmHelm rules compilation failed::Candidate rules failed validation or could not be verified as the exact active version."
              exit 3
            fi
          else
            echo "Hosted Firebase compiler accepted the minimal control and firestore.rules."
          fi
      - name: Verify audited identity counter baselines (read only)
        shell: bash
        env:
          GOOGLE_CLOUD_PROJECT: gen-lang-client-0911422817
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts firebase-admin
          node scripts/initialize-identity-counters.mjs --require-ready

