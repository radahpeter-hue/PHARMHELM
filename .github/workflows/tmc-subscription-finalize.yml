name: TMC Subscription Finalize

on:
  push:
    branches:
      - codex/tmc-subscription-branch-limits-20260908

permissions:
  contents: write

jobs:
  finalize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/tmc-subscription-branch-limits-20260908
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply final hardening
        run: node scripts/finalizeTmcSubscriptionRefactor.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit hardened source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PlatformAdmin.tsx src/types.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Harden trial conversion and complimentary eligibility"
            git push origin HEAD:codex/tmc-subscription-branch-limits-20260908
          fi
