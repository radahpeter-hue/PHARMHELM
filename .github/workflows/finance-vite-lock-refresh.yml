name: Refresh Vite security lockfile (draft PR only)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref_name == 'feature/finance-rebuild-levels4-6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finance-rebuild-levels4-6
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update only patched Vite lock resolution
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit vite@^6.4.5
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=low
          npm run typecheck
          npm test
          npm run build
      - name: Commit refreshed lockfile back to draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): resolve patched Vite in npm lockfile"
            git push origin HEAD:feature/finance-rebuild-levels4-6
          fi
