name: POS V2 Phase 1 UI Docs Patch

on:
  push:
    branches:
      - 'fix/pos-v2-phase1-ui-docs'

permissions:
  contents: write

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip bot finalization commit
        id: guard
        shell: bash
        run: |
          if [ "${GITHUB_ACTOR}" = "github-actions[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply presentation-only Phase 1 patch
        if: steps.guard.outputs.skip != 'true'
        run: python3 scripts/apply-phase1-ui-docs.py

      - name: Confirm protected POS V2 core is untouched
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          protected='src/services/pos-v2/posCheckoutV2Repository.ts|src/services/pos-v2/posCheckoutV2Calculator.ts|src/services/pos-v2/posCheckoutV2Service.ts|src/services/posCheckoutTierService.ts|src/services/posTierCartService.ts|firestore.rules'
          if git diff --name-only 944c571e4f547904697e781c135c4fdd1f2e3c36 -- | grep -E "$protected"; then
            echo 'Protected POS V2 core/rules file changed unexpectedly.' >&2
            exit 1
          fi

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Run full regression suite
        if: steps.guard.outputs.skip != 'true'
        run: npm test

      - name: Lint
        if: steps.guard.outputs.skip != 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.guard.outputs.skip != 'true'
        run: npm run typecheck

      - name: Build
        if: steps.guard.outputs.skip != 'true'
        run: npm run build

      - name: Diff whitespace gate
        if: steps.guard.outputs.skip != 'true'
        run: git diff --check

      - name: Write Phase 1 report
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p docs
          cat > docs/POS_V2_PHASE1_UI_DOCUMENT_FIX_REPORT.md <<'EOF'
          # POS V2 Phase 1 UI and Document Fix Report

          ## Objective
          Correct Receipt Ledger display/search, A4 invoice branch/PDF behaviour, and institutional desktop clipping without modifying the working POS V2 transaction engine.

          ## Baseline
          - `main`: `944c571e4f547904697e781c135c4fdd1f2e3c36`
          - Branch: `fix/pos-v2-phase1-ui-docs`
          - Baseline is merged PR #24, the successful production POS V2 fix.

          ## Files inspected
          - `src/pages/Sales.tsx`
          - `src/components/sales/A4InvoiceTemplate.tsx`
          - `package.json`
          - existing tests and deployment workflows

          ## Root causes
          ### Receipt Ledger
          - Receipt ID rendered an internal sale document prefix rather than `receiptNumber`.
          - Patient/Client rendered `receiptNumber` rather than the customer identity.
          - Search did not cover patient or institution names.

          ### A4 branch
          - The template used `receipt.branchName || 'Main Store'`, falsely labelling branch receipts as Main Store when `branchName` was absent.

          ### A4 PDF
          - The browser-side export had one high-resolution canvas path and no asset wait or recovery path for external-image/canvas failures.
          - The fix waits for fonts/images, constrains raster scale, keeps CORS-safe capture, retries without external images, uses compressed JPEG/blob download, and leaves Print A4 independent.

          ### Institutional desktop layout
          - A growing institutional context card competed with the catalogue inside a height-constrained right column, while the product list retained a desktop minimum height.

          ## Files changed
          - `src/pages/Sales.tsx`
          - `src/components/sales/A4InvoiceTemplate.tsx`
          - `src/utils/salePresentation.ts`
          - `tests/pos-phase1-ui-docs.test.ts`
          - `package.json` only to expose the requested `npm run typecheck` gate
          - `docs/POS_V2_PHASE1_UI_DOCUMENT_FIX_REPORT.md`

          ## Before and after
          - Receipt Ledger now shows the canonical `receiptNumber` with a readable fallback only when missing.
          - Identity display priority is institution, patient, Anonymous for unnamed walk-in, then `Identity not recorded`.
          - Search matches receipt number, institution name and patient name.
          - A4 branch resolution prefers stored `branchName`, then the sale `branchId`, then active branch only when IDs match, otherwise `Branch not available`.
          - No false `Main Store` fallback remains in the A4 invoice.
          - PDF export has a client-side recovery path and printing remains available separately.
          - Institutional desktop context and catalogue now have explicit height/scroll ownership so product selection remains reachable at 100% zoom.

          ## POS V2 core protection
          The validation fails if any protected transaction/rules file changes. No stock, batch, payment, outbox, activation, migration, tenant configuration or production-data operation is performed.

          ## Tests added
          `tests/pos-phase1-ui-docs.test.ts` covers receipt display, identity precedence, Anonymous/missing identity, the three search fields, A4 branch resolution, removal of Main Store fallback, PDF recovery contract, and desktop catalogue scrolling.

          ## Gate results
          All gates below passed before the implementation commit was written:
          - `npm ci`: PASS
          - `npm test`: PASS
          - `npm run lint`: PASS
          - `npm run typecheck`: PASS
          - `npm run build`: PASS
          - `git diff --check`: PASS
          - protected core diff guard: PASS

          ## Risks
          - PDF remains browser-side and still depends on browser download permissions. Print A4 remains the fallback.
          - Resolving a missing stored branch name requires one branch-document read.
          - On short desktop viewports the context card can scroll independently by design.

          ## Rollback
          Revert the single Phase 1 implementation commit. No migration, rules rollback, stock repair or configuration rollback is required.

          ## Recommended live validation after approval and deployment
          1. Verify a Masaka V2 receipt shows its canonical receipt number.
          2. Verify institution, named patient and Anonymous display cases.
          3. Search by receipt number, institution and patient.
          4. Verify the A4 invoice shows Masaka, not Main Store.
          5. Test PDF download on desktop Chrome and mobile Safari, including a remote logo.
          6. Verify Print A4 remains available.
          7. At 100% desktop zoom select Institutional and confirm fields, product search/results, basket and checkout remain reachable.
          EOF

      - name: Final protected-core and diff checks
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          protected='src/services/pos-v2/posCheckoutV2Repository.ts|src/services/pos-v2/posCheckoutV2Calculator.ts|src/services/pos-v2/posCheckoutV2Service.ts|src/services/posCheckoutTierService.ts|src/services/posTierCartService.ts|firestore.rules'
          if git diff --name-only 944c571e4f547904697e781c135c4fdd1f2e3c36 -- | grep -E "$protected"; then
            echo 'Protected POS V2 core/rules file changed unexpectedly.' >&2
            exit 1
          fi
          git status --short

      - name: Commit validated Phase 1 changes only
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase1-ui-docs-patch.yml scripts/apply-phase1-ui-docs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Sales.tsx src/components/sales/A4InvoiceTemplate.tsx src/utils/salePresentation.ts tests/pos-phase1-ui-docs.test.ts package.json docs/POS_V2_PHASE1_UI_DOCUMENT_FIX_REPORT.md
          git commit -m 'fix: POS V2 phase 1 UI and invoice presentation'
          git push origin HEAD:fix/pos-v2-phase1-ui-docs
