name: Deploy Firestore Indexes

on:
  push:
    branches:
      - main
    paths:
      - firestore.indexes.json
      - firebase.json
      - .github/workflows/firestore-indexes-deploy.yml
      - scripts/deploy-firestore-indexes.mjs
      - scripts/verify-operational-inventory-indexes.mjs
  workflow_dispatch:

jobs:
  deploy_indexes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: gen-lang-client-0911422817
      FIRESTORE_DATABASE_ID: "ai-studio-f7d8654b-e089-425a-a506-38159afe1e75"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Select Firebase project
        run: gcloud config set project "$FIREBASE_PROJECT_ID"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy all composite indexes from the repository manifest
        run: node scripts/deploy-firestore-indexes.mjs

      - name: Verify Operational Inventory composite indexes are ready
        timeout-minutes: 15
        run: node scripts/verify-operational-inventory-indexes.mjs

      - name: Show composite index status
        run: gcloud firestore indexes composite list --project="$FIREBASE_PROJECT_ID" --database="$FIRESTORE_DATABASE_ID" --format='table(name.basename(),collectionGroup,queryScope,state,fields)'
