name: Deploy Firestore Indexes

on:
  push:
    branches:
      - main
    paths:
      - firestore.indexes.json
      - firebase.json
      - .github/workflows/firestore-indexes-deploy.yml
  workflow_dispatch:

jobs:
  deploy_indexes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: gen-lang-client-0911422817
      FIRESTORE_DATABASE_ID: "(default)"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Select Firebase project
        run: gcloud config set project "$FIREBASE_PROJECT_ID"

      - name: Deploy POS product batch indexes directly
        shell: bash
        run: |
          set -euo pipefail

          create_index() {
            local label="$1"
            shift

            echo "Creating/checking Firestore index: $label"
            set +e
            output=$(gcloud firestore indexes composite create \
              --project="$FIREBASE_PROJECT_ID" \
              --database="$FIRESTORE_DATABASE_ID" \
              --collection-group=product_batches \
              --query-scope=collection \
              "$@" \
              --async \
              --quiet 2>&1)
            status=$?
            set -e

            echo "$output"

            if [ "$status" -eq 0 ]; then
              return 0
            fi

            if echo "$output" | grep -Eqi 'already exists|ALREADY_EXISTS'; then
              echo "Index already exists: $label"
              return 0
            fi

            echo "Failed to create Firestore index: $label" >&2
            return "$status"
          }

          create_index "tenant + branch + product" \
            --field-config=field-path=tenantId,order=ascending \
            --field-config=field-path=branchId,order=ascending \
            --field-config=field-path=productId,order=ascending

          create_index "tenant + branch + product + batch number" \
            --field-config=field-path=tenantId,order=ascending \
            --field-config=field-path=branchId,order=ascending \
            --field-config=field-path=productId,order=ascending \
            --field-config=field-path=batchNumber,order=ascending

      - name: Show product batch index status
        run: |
          gcloud firestore indexes composite list \
            --project="$FIREBASE_PROJECT_ID" \
            --database="$FIRESTORE_DATABASE_ID" \
            --format='table(name.basename(),queryScope,state,fields)'
