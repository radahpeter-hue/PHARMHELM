name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install @tailwindcss/oxide-linux-x64-gnu --save-optional --no-save

      - name: Build project
        run: |
          npm run lint
          npm run build

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Firestore rules
        shell: bash
        env:
          FIRESTORE_DATABASE_ID: ai-studio-f7d8654b-e089-425a-a506-38159afe1e75
        run: |
          deploy_status=1
          for attempt in 1 2 3 4; do
            set +e
            deploy_output=$(npx firebase-tools deploy --only firestore:rules --project gen-lang-client-0911422817 --non-interactive 2>&1)
            deploy_status=$?
            set -e
            echo "$deploy_output"
            if [ "$deploy_status" -eq 0 ]; then
              break
            fi
            if [[ "$deploy_output" != *"HTTP Error: 503"* ]] || [ "$attempt" -eq 4 ]; then
              break
            fi
            retry_delay=$((attempt * 15))
            echo "Firebase Rules API returned 503. Retrying in ${retry_delay} seconds (attempt $((attempt + 1)) of 4)."
            sleep "$retry_delay"
          done
          plain_deploy_output=$(printf '%s' "$deploy_output" | sed -E $'s/\x1B\\[[0-9;]*[mK]//g')
          if [ "$deploy_status" -ne 0 ] && [[ "$plain_deploy_output" == *"HTTP Error: 409"* ]] && [[ "$plain_deploy_output" == *"already up to date, skipping upload"* ]]; then
            echo "Firestore rules are already the active latest version; accepting the Firebase CLI 409 as an idempotent success."
            deploy_status=0
          elif [ "$deploy_status" -ne 0 ] && [[ "$plain_deploy_output" == *"HTTP Error: 409"* ]] && [[ "$plain_deploy_output" == *"rules file"*"compiled successfully"* ]]; then
            FIREBASE_ACCESS_TOKEN=$(gcloud auth application-default print-access-token)
            release_url="https://firebaserules.googleapis.com/v1/projects/gen-lang-client-0911422817/releases/cloud.firestore/${FIRESTORE_DATABASE_ID}"
            release_json=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${FIREBASE_ACCESS_TOKEN}" \
              "$release_url")
            ruleset_name=$(printf '%s' "$release_json" | jq -r '.rulesetName // empty')
            if [ -n "$ruleset_name" ]; then
              ruleset_json=$(curl --fail --silent --show-error \
                -H "Authorization: Bearer ${FIREBASE_ACCESS_TOKEN}" \
                "https://firebaserules.googleapis.com/v1/${ruleset_name}")
              active_rules=$(printf '%s' "$ruleset_json" | jq -r 'first(.source.files[] | select(.name == "firestore.rules") | .content) // empty')
              if [ -n "$active_rules" ] && [ "$active_rules" = "$(cat firestore.rules)" ]; then
                echo "The active named-database release exactly matches firestore.rules; accepting the Firebase CLI 409 as an idempotent success."
                deploy_status=0
              fi
            fi
            if [ "$deploy_status" -ne 0 ]; then
              rulesets_url="https://firebaserules.googleapis.com/v1/projects/gen-lang-client-0911422817/rulesets?pageSize=20"
              matching_ruleset=""
              while IFS= read -r candidate_ruleset; do
                [ -z "$candidate_ruleset" ] && continue
                candidate_json=$(curl --fail --silent --show-error \
                  -H "Authorization: Bearer ${FIREBASE_ACCESS_TOKEN}" \
                  "https://firebaserules.googleapis.com/v1/${candidate_ruleset}")
                candidate_rules=$(printf '%s' "$candidate_json" | jq -r 'first(.source.files[] | select(.name == "firestore.rules") | .content) // empty')
                if [ -n "$candidate_rules" ] && [ "$candidate_rules" = "$(cat firestore.rules)" ]; then
                  matching_ruleset="$candidate_ruleset"
                  break
                fi
              done < <(curl --fail --silent --show-error \
                -H "Authorization: Bearer ${FIREBASE_ACCESS_TOKEN}" \
                "$rulesets_url" | jq -r '.rulesets[]?.name')

              if [ -n "$matching_ruleset" ]; then
                release_name="projects/gen-lang-client-0911422817/releases/cloud.firestore/${FIRESTORE_DATABASE_ID}"
                patch_body=$(jq -n \
                  --arg name "$release_name" \
                  --arg rulesetName "$matching_ruleset" \
                  '{name: $name, rulesetName: $rulesetName}')
                patched_release=$(curl --fail --silent --show-error \
                  -X PATCH \
                  -H "Authorization: Bearer ${FIREBASE_ACCESS_TOKEN}" \
                  -H "Content-Type: application/json" \
                  --data "$patch_body" \
                  "https://firebaserules.googleapis.com/v1/${release_name}?updateMask=rulesetName")
                patched_ruleset=$(printf '%s' "$patched_release" | jq -r '.rulesetName // empty')
                if [ "$patched_ruleset" = "$matching_ruleset" ]; then
                  echo "Updated the named Firestore release to the matching compiled ruleset after Firebase CLI 409."
                  deploy_status=0
                fi
              fi
            fi
          fi
          if [ "$deploy_status" -ne 0 ] && ([[ "$plain_deploy_output" == *"HTTP Error: 503"* ]] || [[ "$plain_deploy_output" == *"HTTP Error: 409"* ]]); then
            FIREBASE_ACCESS_TOKEN=$(gcloud auth application-default print-access-token)
            rulesets_url="https://firebaserules.googleapis.com/v1/projects/gen-lang-client-0911422817/rulesets?pageSize=50"
            matching_ruleset=""

            set +e
            rulesets_json=$(curl --retry 4 --retry-all-errors --retry-delay 10 --fail --silent --show-error \
              -H "Authorization: Bearer ${FIREBASE_ACCESS_TOKEN}" \
              "$rulesets_url")
            set -e
            while IFS= read -r candidate_ruleset; do
              [ -z "$candidate_ruleset" ] && continue
              set +e
              candidate_json=$(curl --retry 4 --retry-all-errors --retry-delay 10 --fail --silent --show-error \
                -H "Authorization: Bearer ${FIREBASE_ACCESS_TOKEN}" \
                "https://firebaserules.googleapis.com/v1/${candidate_ruleset}")
              candidate_status=$?
              set -e
              [ "$candidate_status" -ne 0 ] && continue
              candidate_rules=$(printf '%s' "$candidate_json" | jq -r 'first(.source.files[]? | select(.name == "firestore.rules") | .content) // empty')
              if [ -n "$candidate_rules" ] && [ "$candidate_rules" = "$(cat firestore.rules)" ]; then
                matching_ruleset="$candidate_ruleset"
                break
              fi
            done < <(printf '%s' "$rulesets_json" | jq -r '.rulesets[]?.name')

            if [ -z "$matching_ruleset" ]; then
              create_body=$(jq -n --rawfile rules firestore.rules \
                '{source: {files: [{name: "firestore.rules", content: $rules}]}}')
              set +e
              created_ruleset=$(curl --retry 4 --retry-all-errors --retry-delay 10 --fail --silent --show-error \
                -X POST \
                -H "Authorization: Bearer ${FIREBASE_ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$create_body" \
                "https://firebaserules.googleapis.com/v1/projects/gen-lang-client-0911422817/rulesets")
              create_status=$?
              set -e
              if [ "$create_status" -eq 0 ]; then
                matching_ruleset=$(printf '%s' "$created_ruleset" | jq -r '.name // empty')
              fi
            fi

            if [ -n "$matching_ruleset" ]; then
              release_name="projects/gen-lang-client-0911422817/releases/cloud.firestore/${FIRESTORE_DATABASE_ID}"
              patch_body=$(jq -n --arg name "$release_name" --arg rulesetName "$matching_ruleset" \
                '{name: $name, rulesetName: $rulesetName}')
              set +e
              patched_release=$(curl --retry 4 --retry-all-errors --retry-delay 10 --fail --silent --show-error \
                -X PATCH \
                -H "Authorization: Bearer ${FIREBASE_ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$patch_body" \
                "https://firebaserules.googleapis.com/v1/${release_name}?updateMask=rulesetName")
              patch_status=$?
              set -e
              if [ "$patch_status" -eq 0 ] && [ "$(printf '%s' "$patched_release" | jq -r '.rulesetName // empty')" = "$matching_ruleset" ]; then
                echo "Activated the matching Firestore ruleset through the Rules REST API after Firebase CLI service errors."
                deploy_status=0
              fi
            fi
          fi
          if [ "$deploy_status" -ne 0 ]; then
            escaped_output=${deploy_output//'%'/'%25'}
            escaped_output=${escaped_output//$'\r'/'%0D'}
            escaped_output=${escaped_output//$'\n'/'%0A'}
            echo "::error title=Firestore rules deployment failed::$escaped_output"
            exit "$deploy_status"
          fi

      - name: Deploy Firebase Storage rules
        id: deploy_storage
        continue-on-error: true
        run: npx firebase-tools deploy --only storage --project gen-lang-client-0911422817 --non-interactive

      - name: Report deferred Firebase Storage deployment
        if: steps.deploy_storage.outcome == 'failure'
        run: |
          echo "::warning title=Firebase Storage deployment deferred::Storage rules were not deployed because Cloud Storage is unavailable on the current Spark plan. Firestore and Hosting deployment will continue."

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: gen-lang-client-0911422817
