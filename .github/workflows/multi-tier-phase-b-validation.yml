name: Multi Tier Phase B Validation

on:
  push:
    branches:
      - codex/multi-tier-phase-b-20260908

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install @tailwindcss/oxide-linux-x64-gnu --save-optional --no-save

      - name: TypeScript validation
        run: npm run lint

      - name: Test suite
        run: npm test

      - name: Production build
        run: npm run build
