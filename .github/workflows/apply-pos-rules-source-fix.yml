name: Apply POS Rules Source Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-pos-rules-source-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch_rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove Cashier from backend POS operator rule
        shell: bash
        run: |
          set -euo pipefail
          grep -F "hasRole('Cashier') || hasRole('cashier') ||" firestore.rules
          sed -i "/hasRole('Cashier') || hasRole('cashier') ||/d" firestore.rules
          git diff --check

      - name: Commit POS rules correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore.rules
          git commit -m 'fix(pos): remove cashier from Firestore POS operator authority'
          git push origin HEAD:main
