name: Validate RBAC role boundaries

on:
  push:
    branches:
      - codex/supervisor-hr-appraisal-access-20260910
    paths:
      - .github/workflows/rbac-boundary-validate.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RBAC branch
        uses: actions/checkout@v4
        with:
          ref: codex/supervisor-hr-appraisal-access-20260910
          fetch-depth: 0

      - name: Apply RBAC boundary hardening
        run: python scripts/apply-rbac-boundary-hardening.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Role boundary regression tests
        run: npm test

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff validation
        run: git diff --check

      - name: Commit validated RBAC hardening
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No product changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/rbac.ts src/pages/Finance.tsx firestore.rules tests/rbac-role-boundaries.test.ts
          git commit -m "fix(rbac): enforce role and finance access boundaries"
          git push origin HEAD:codex/supervisor-hr-appraisal-access-20260910
