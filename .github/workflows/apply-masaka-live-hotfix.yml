name: Masaka Hotfix Verifier

on:
  push:
    branches:
      - fix/masaka-pos-v2-live-failures

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Align live outbox anchor
        run: sed -i 's/errorMessage: null/lastError: null/g' scripts/apply_masaka_live_hotfix.py
      - run: python3 scripts/apply_masaka_live_hotfix.py
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply_masaka_live_hotfix.py
          rm -f .github/workflows/apply-masaka-live-hotfix.yml
          rm -f .github/workflows/apply-masaka-live-hotfix-v2.yml
          git add -A
          git commit -m "fix: harden Masaka POS and inventory live flows"
          git push origin HEAD:fix/masaka-pos-v2-live-failures
