name: Verify POS V2 Zero Stock Selection

on:
  push:
    branches:
      - fix/pos-v2-eligibility-final

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply zero-stock selection correction
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('src/pages/Sales.tsx')
          text = p.read_text()
          old = """  const filteredItems = activeTab === 'products' 
    ? products.filter(p => {
        const hasStock = getProductUsableBaseStock(batches, p.id) > 0;
        const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
          p.sku.toLowerCase().includes(searchTerm.toLowerCase()) ||
          p.genericName?.toLowerCase().includes(searchTerm.toLowerCase());
        return hasStock && matchesSearch;
      })
"""
          new = """  const filteredItems = activeTab === 'products' 
    ? products.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
          p.sku.toLowerCase().includes(searchTerm.toLowerCase()) ||
          p.genericName?.toLowerCase().includes(searchTerm.toLowerCase());
        return matchesSearch;
      })
"""
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one product search stock filter anchor.')
          text = text.replace(old, new, 1)
          old_message = "        toast.error('No active/unexpired stock available for this product');"
          new_message = "        toast.error(`Insufficient eligible stock for ${product.name}. No sellable batch is available.`);"
          if text.count(old_message) != 1:
              raise SystemExit('Expected exactly one no-stock basket message anchor.')
          text = text.replace(old_message, new_message, 1)
          p.write_text(text)

          t = Path('tests/pos-final-eligibility-regression.test.ts')
          tests = t.read_text()
          append = """

test('product search keeps zero-eligible-stock products selectable so basket validation can explain rejection', () => {
  const sales = readFileSync('src/pages/Sales.tsx', 'utf8');
  assert.doesNotMatch(sales, /return hasStock && matchesSearch/);
  assert.match(sales, /Insufficient eligible stock for \$\{product\.name\}\. No sellable batch is available\./);
});

test('QA quarantine rule preserves branch scope for non-head QA users', () => {
  const rules = readFileSync('firestore.rules', 'utf8');
  assert.match(rules, /isQA\(\)[\s\S]{0,180}isAssignedToBranch\(resource\.data\.branchId\)/);
  assert.match(rules, /QA Head/);
  assert.match(rules, /request\.resource\.data\.batch_status == 'quarantined'/);
});
"""
          if 'zero-eligible-stock products selectable' in tests:
              raise SystemExit('Regression test already present.')
          t.write_text(tests.rstrip() + append)
          PY
      - name: Test
        run: npm test
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff validation
        run: git diff --check
      - name: Commit verified correction
        shell: bash
        run: |
          rm .github/workflows/verify-pos-v2-zero-stock-selection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: keep unavailable products selectable for POS feedback [zero-stock-selection-applied]'
          git push origin HEAD:fix/pos-v2-eligibility-final
