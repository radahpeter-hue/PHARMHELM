name: Phase 4 Thermal Reprint Seller Fix

on:
  push:
    branches:
      - fix/phase4-thermal-reprint-seller
    paths:
      - 'scripts/apply-phase4-thermal-reprint-seller.mjs'
      - '.github/workflows/phase4-thermal-reprint-seller.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/phase4-thermal-reprint-seller

      - name: Apply seller fix
        run: node scripts/apply-phase4-thermal-reprint-seller.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run focused reprint test
        run: node --import tsx --test tests/thermal-reprint-seller.test.ts tests/sale-presentation.test.ts

      - name: TypeScript validation
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify protected POS V2 engine unchanged
        run: |
          git diff --exit-code main -- \
            src/services/pos-v2/posCheckoutV2Repository.ts \
            src/services/pos-v2/posCheckoutV2Calculator.ts \
            src/services/pos-v2/posCheckoutV2Service.ts

      - name: Remove temporary patch machinery
        run: |
          rm -f scripts/apply-phase4-thermal-reprint-seller.mjs
          rm -f .github/workflows/phase4-thermal-reprint-seller.yml

      - name: Commit validated repair
        run: |
          git config user.name "PharmHelm CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: use canonical seller name in receipt reprint preview"
          git push origin HEAD:fix/phase4-thermal-reprint-seller
