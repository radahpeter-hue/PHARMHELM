name: Retire confirmed Martin Pharma duplicate staff
on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ['Deploy to Firebase']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: martin-staff-duplicate-retirement
  cancel-in-progress: false
jobs:
  retire_duplicates:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'fix/staff-duplicates-readable-reports' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && contains(github.event.workflow_run.head_commit.message, 'Merge pull request #95 '))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --prefix /tmp/staff-backfill-runtime --no-save --ignore-scripts firebase-admin@13.6.0
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - name: Read-only verified retirement preflight
        if: github.event_name == 'pull_request'
        run: node --import tsx scripts/retire-martin-staff-duplicates.mjs
      - name: Retire and verify duplicates after successful reviewed production deployment
        if: github.event_name == 'workflow_run'
        run: node --import tsx scripts/retire-martin-staff-duplicates.mjs --apply
