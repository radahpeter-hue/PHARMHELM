name: Finalize RBAC alignment

on:
  push:
    branches:
      - codex/rbac-system-custom-roles-20260908
    paths:
      - .github/workflows/rbac-finalize.yml

permissions:
  contents: write

jobs:
  finalize-rbac:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rbac-system-custom-roles-20260908
          fetch-depth: 0

      - name: Finalize RBAC source and rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Normalize role-registry keys and support accepted display-name aliases.
          path = Path('src/contexts/AuthContext.tsx')
          text = path.read_text()
          old = """// System-generated roles are authoritative and immutable. Legacy keys are retained
          // only for backwards compatibility with historical staff records.
          export const ROLE_REGISTRY: Record<string, RolePermissions> = {
            ...LEGACY_ROLE_REGISTRY,
            ...(SYSTEM_ROLE_PERMISSIONS as Record<string, RolePermissions>)
          };"""
          new = """// System-generated roles are authoritative and immutable. Registry keys are normalized
          // so historical casing cannot override the current role definition.
          const ROLE_ALIASES: Record<string, string> = {
            'ceo / md': 'ceo',
            'it support personnel': 'it support staff',
            'procurement personnel': 'procurement officer'
          };

          export const ROLE_REGISTRY: Record<string, RolePermissions> = {
            ...Object.fromEntries(Object.entries(LEGACY_ROLE_REGISTRY).map(([role, permissions]) => [role.toLowerCase(), permissions])),
            ...Object.fromEntries(Object.entries(SYSTEM_ROLE_PERMISSIONS as Record<string, RolePermissions>).map(([role, permissions]) => [role.toLowerCase(), permissions]))
          };"""
          if old not in text:
            raise SystemExit('AuthContext normalized registry target not found')
          text = text.replace(old, new, 1)
          old_lookup = "const registryKey = Object.keys(ROLE_REGISTRY).find(k => k.toLowerCase() === role.toLowerCase()) || role;"
          new_lookup = "const normalizedRole = role.trim().toLowerCase();\n                const registryKey = ROLE_ALIASES[normalizedRole] || normalizedRole;"
          if old_lookup not in text:
            raise SystemExit('AuthContext registry lookup target not found')
          text = text.replace(old_lookup, new_lookup, 1)
          path.write_text(text)

          # Make Staff Directory consume the same system role list instead of duplicating it.
          path = Path('src/modules/hr/StaffDirectory.tsx')
          text = path.read_text()
          text = text.replace(
            "import { roleRealmId } from '../../config/rbac';",
            "import { roleRealmId, SYSTEM_ROLE_NAMES } from '../../config/rbac';"
          )
          pattern = re.compile(r"  const systemDefaultRoleNames = \[.*?\.filter\(\(v, i, self\) => self\.findIndex\(x => x\.toLowerCase\(\) === v\.toLowerCase\(\)\) === i\); // Case-insensitive deduplication", re.S)
          replacement = """  const systemDefaultRoleNames = SYSTEM_ROLE_NAMES.map(role => role.toLowerCase());

  const allAvailableRoles = [
    ...SYSTEM_ROLE_NAMES,
    ...(customRoles || [])
      .map((r: any) => r.name?.trim())
      .filter(roleName => roleName && !systemDefaultRoleNames.includes(roleName.toLowerCase()))
  ].map(r => r.trim())
   .filter((v, i, self) => self.findIndex(x => x.toLowerCase() === v.toLowerCase()) === i); // Case-insensitive deduplication"""
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'StaffDirectory system role list target matched {count} times')
          path.write_text(text2)

          # Tighten old operator helpers to match the accepted stock / inventory matrix.
          path = Path('firestore.rules')
          text = path.read_text()
          old_inventory = """    function isInventoryOperator() {
            return isAuthenticated() && (
              hasRole('Branch Manager') || hasRole('branch manager') ||
              hasRole('Pharmacist') || hasRole('pharmacist') || hasRole('Dispenser') ||
              hasRole('Procurement Head') || hasRole('Procurement Officer') ||
              hasRole('QA Head') || hasRole('QA Officer') ||
              hasRole('Logistics Head') || hasRole('Logistics Manager') ||
              hasCustomModuleFunctional('inventory') ||
              isAdmin()
            );
          }"""
          new_inventory = """    function isInventoryOperator() {
            return isAuthenticated() && (
              hasRole('Branch Manager') || hasRole('branch manager') ||
              hasRole('Pharmacist') || hasRole('pharmacist') ||
              hasRole('Procurement Head') || hasRole('Procurement Officer') ||
              hasCustomModuleFunctional('inventory') ||
              isAdmin()
            );
          }"""
          if old_inventory not in text:
            raise SystemExit('Inventory operator target not found')
          text = text.replace(old_inventory, new_inventory, 1)

          old_stock = """    function isStockOperator() {
            return isAuthenticated() && (
              hasRole('Branch Manager') || hasRole('branch manager') ||
              hasRole('Pharmacist') || hasRole('pharmacist') ||
              hasRole('Procurement Head') || hasRole('Procurement Officer') || hasRole('Procurement Manager') ||
              hasRole('QA Head') ||
              hasRole('Logistics Head') || hasRole('Logistics Manager') ||
              hasCustomModuleFunctional('stock') ||
              isAdmin()
            );
          }"""
          new_stock = """    function isStockOperator() {
            return isAuthenticated() && (
              hasRole('Branch Manager') || hasRole('branch manager') ||
              hasRole('Pharmacist') || hasRole('pharmacist') ||
              hasRole('Dispenser') || hasRole('dispenser') ||
              hasRole('Procurement Head') || hasRole('Procurement Officer') || hasRole('Procurement Manager') ||
              hasCustomModuleFunctional('stock') ||
              isAdmin()
            );
          }"""
          if old_stock not in text:
            raise SystemExit('Stock operator target not found')
          text = text.replace(old_stock, new_stock, 1)

          # Add view helpers so custom View-only roles work with collections that already
          # have strict role-gated reads, without turning view access into write authority.
          marker = """    function isSettingsAdmin() {
            return isAuthenticated() && (isAdmin() || isIT() || hasCustomModuleFunctional('settings'));
          }
"""
          helpers = marker + """

          function hasCustomModuleView(moduleKey) {
            return isAuthenticated()
              && ('roleRealmId' in getUserData())
              && getUserData().roleRealmId is string
              && getUserData().roleRealmId.size() > 0
              && exists(/databases/$(database)/documents/role_realms_of_operation/$(getUserData().roleRealmId))
              && get(/databases/$(database)/documents/role_realms_of_operation/$(getUserData().roleRealmId)).data.tenantId == getUserData().tenantId
              && get(/databases/$(database)/documents/role_realms_of_operation/$(getUserData().roleRealmId)).data.roleType == 'custom'
              && get(/databases/$(database)/documents/role_realms_of_operation/$(getUserData().roleRealmId)).data.roleName == getUserData().role
              && moduleKey in get(/databases/$(database)/documents/role_realms_of_operation/$(getUserData().roleRealmId)).data.permissions
              && get(/databases/$(database)/documents/role_realms_of_operation/$(getUserData().roleRealmId)).data.permissions[moduleKey].accessLevel in ['view_only', 'view_functional', 'all'];
          }

          function canViewFinance() {
            return isFinance() || isITPersonnel() || hasCustomModuleView('finance');
          }

          function canViewProcurement() {
            return isProcurement()
              || hasRole('Finance Head') || hasRole('QA Head') || hasRole('QA Officer')
              || hasRole('Logistics Head') || hasRole('Pharmacist') || hasRole('pharmacist')
              || hasRole('admin') || hasRole('Admin') || isITPersonnel()
              || hasCustomModuleView('procurement');
          }

          function canViewMarketing() {
            return isMarketing() || hasRole('QA Head') || isFinance() || isITPersonnel() || hasCustomModuleView('marketing');
          }
"""
          if marker not in text:
            raise SystemExit('Settings helper marker not found')
          text = text.replace(marker, helpers, 1)

          # Admin is functional in Marketing under the accepted matrix.
          text = text.replace(
            "hasRole('Marketing Head') || hasRole('Marketing Personnel') || hasRole('Marketing Manager') ||\n        hasCustomModuleFunctional('marketing') || isAdmin()",
            "hasRole('Marketing Head') || hasRole('Marketing Personnel') || hasRole('Marketing Manager') ||\n        hasRole('admin') || hasRole('Admin') || hasCustomModuleFunctional('marketing') || isAdmin()",
            1,
          )

          # Strict procurement reads.
          text = text.replace(
            "allow read: if isAuthenticated() && isTenantMember(resource.data.tenantId) && (isProcurement() || isBranchManager());",
            "allow read: if isAuthenticated() && isTenantMember(resource.data.tenantId) && (canViewProcurement() || isBranchManager());"
          )
          text = text.replace(
            "allow read: if isAuthenticated() && isTenantMember(resource.data.tenantId) && isProcurement();",
            "allow read: if isAuthenticated() && isTenantMember(resource.data.tenantId) && canViewProcurement();"
          )

          # Common strict finance reads.
          text = text.replace(
            "allow read: if isAuthenticated() && isTenantMember(resource.data.tenantId) && isFinance();",
            "allow read: if isAuthenticated() && isTenantMember(resource.data.tenantId) && canViewFinance();"
          )

          # Marketing read access is separated from marketing write authority.
          text = text.replace(
            "allow read: if isAuthenticated() && isTenantMember(resource.data.tenantId) && isMarketing();",
            "allow read: if isAuthenticated() && isTenantMember(resource.data.tenantId) && canViewMarketing();"
          )
          text = text.replace(
            "allow read: if isAuthenticated() && isTenantMember(resource.data.tenantId) && (isMarketing() || isFinance());",
            "allow read: if isAuthenticated() && isTenantMember(resource.data.tenantId) && canViewMarketing();"
          )

          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Commit final alignment
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No final alignment changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contexts/AuthContext.tsx src/modules/hr/StaffDirectory.tsx firestore.rules
          git commit -m "fix(rbac): normalize roles and tighten module operators"
          git push origin HEAD:codex/rbac-system-custom-roles-20260908
