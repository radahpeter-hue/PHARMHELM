name: Firestore compiled release size
on:
  pull_request:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'scripts/build-firestore-release-rules.mjs'
      - 'scripts/validate-inactive-finance-rules.mjs'
      - 'scripts/firestore-unbound-probe.mjs'
      - 'scripts/diagnose-firestore-compiler.mjs'
      - '.github/workflows/firestore-release-size.yml'
permissions:
  contents: read
jobs:
  activation-size:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile compact equivalent rule symbols
        run: node scripts/build-firestore-release-rules.mjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - run: npm install --prefix /tmp/rules-size --no-save --ignore-scripts google-auth-library
      - name: Require actual compiled executable to fit the activation limit
        id: candidate
        run: |
          cp scripts/validate-inactive-finance-rules.mjs /tmp/rules-size/validate.mjs
          cp scripts/firestore-unbound-probe.mjs /tmp/rules-size/firestore-unbound-probe.mjs
          node /tmp/rules-size/validate.mjs
      - name: Diagnose compiler failure against deny-all and exact PR base controls
        if: failure() && steps.candidate.outcome == 'failure'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:firestore.rules" > /tmp/main-control.rules
          git show "$BASE_SHA:scripts/build-firestore-release-rules.mjs" > /tmp/main-control-build.mjs
          node /tmp/main-control-build.mjs /tmp/main-control.rules
          git show HEAD:firestore.rules > /tmp/authored-candidate.rules
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {compactRuleSymbols,wrapReleaseColumns} from './scripts/build-firestore-release-rules.mjs';
          const source=readFileSync('/tmp/authored-candidate.rules','utf8');
          const variants={
            baseline:{maxLocalOwners:0,sharePaths:false,memoize:false,balanceConditions:false,groupCollections:false,packArrays:false,shareReaders:false,shareSchemas:false,shareConstants:false},
            unbalanced:{balanceConditions:false},
            shared:{maxLocalOwners:0,balanceConditions:false},
          };
          for(const [name,options] of Object.entries(variants)) writeFileSync(`/tmp/${name}.rules`,wrapReleaseColumns(compactRuleSymbols(source,options))+'\n');
          // Restrictive diagnostic subsets only, never deployment candidates.
          const blocks=[...source.matchAll(/^    match [^\n]+ \{[\s\S]*?^    }/gm)];
          for(const half of [0,1]){
            let reduced=source;
            for(let index=blocks.length-1;index>=0;index--)if(index%2!==half){const block=blocks[index];reduced=reduced.slice(0,block.index)+reduced.slice(block.index+block[0].length);}
            writeFileSync(`/tmp/half-${half}.rules`,wrapReleaseColumns(compactRuleSymbols(reduced))+'\n');
          }
          JS
          cp scripts/diagnose-firestore-compiler.mjs /tmp/rules-size/diagnose.mjs
          node /tmp/rules-size/diagnose.mjs /tmp/main-control.rules /tmp/baseline.rules /tmp/unbalanced.rules /tmp/shared.rules /tmp/half-0.rules /tmp/half-1.rules
