name: Force Deploy Named Firestore Rules

on:
  workflow_dispatch:

jobs:
  deploy_rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: gen-lang-client-0911422817
      FIRESTORE_DATABASE_ID: ai-studio-f7d8654b-e089-425a-a506-38159afe1e75
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate Google service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy and verify rules on named Firestore database
        shell: bash
        run: |
          set -euo pipefail

          echo "Attempting Firebase CLI deployment against database ${FIRESTORE_DATABASE_ID}."
          cli_status=1
          for attempt in 1 2 3 4; do
            set +e
            npx firebase-tools deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
            cli_status=$?
            set -e
            if [ "$cli_status" -eq 0 ]; then
              echo "Firebase CLI reported successful Firestore rules deployment."
              break
            fi
            delay=$((attempt * 15))
            echo "Firebase CLI rules deployment failed on attempt ${attempt}; retrying in ${delay}s."
            sleep "$delay"
          done

          ACCESS_TOKEN=$(gcloud auth application-default print-access-token)
          RULES_API="https://firebaserules.googleapis.com/v1"
          RELEASE_NAME="projects/${FIREBASE_PROJECT_ID}/releases/cloud.firestore/${FIRESTORE_DATABASE_ID}"

          echo "Reading named database release for verification."
          set +e
          current_release=$(curl --retry 6 --retry-all-errors --retry-delay 15 --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${RULES_API}/${RELEASE_NAME}")
          verify_status=$?
          set -e

          if [ "$cli_status" -eq 0 ] && [ "$verify_status" -eq 0 ]; then
            active_ruleset=$(printf '%s' "$current_release" | jq -r '.rulesetName // empty')
            if [ -z "$active_ruleset" ]; then
              echo "$current_release"
              echo "::error::Named Firestore release returned no active ruleset after CLI deployment."
              exit 3
            fi
            echo "Named database rules deployment verified after CLI deployment."
            echo "database=${FIRESTORE_DATABASE_ID}"
            echo "release=${RELEASE_NAME}"
            echo "ruleset=${active_ruleset}"
            exit 0
          fi

          echo "CLI deployment or release verification did not complete. Falling back to explicit Rules REST deployment."
          FINGERPRINT=$(openssl dgst -sha256 -binary firestore.rules | base64 -w 0)
          create_body=$(jq -n \
            --rawfile rules firestore.rules \
            --arg fingerprint "$FINGERPRINT" \
            '{source: {files: [{name: "firestore.rules", content: $rules, fingerprint: $fingerprint}]}}')

          set +e
          created_ruleset=$(curl --retry 10 --retry-all-errors --retry-delay 20 --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$create_body" \
            "${RULES_API}/projects/${FIREBASE_PROJECT_ID}/rulesets")
          create_status=$?
          set -e

          if [ "$create_status" -ne 0 ]; then
            echo "$created_ruleset"
            echo "::error::Firebase Rules API remained unavailable after CLI and REST retries. No ruleset change was activated."
            exit 22
          fi

          ruleset_name=$(printf '%s' "$created_ruleset" | jq -r '.name // empty')
          if [ -z "$ruleset_name" ]; then
            echo "$created_ruleset"
            echo "::error::Rules API returned no ruleset name."
            exit 2
          fi

          patch_body=$(jq -n \
            --arg name "$RELEASE_NAME" \
            --arg rulesetName "$ruleset_name" \
            '{release: {name: $name, rulesetName: $rulesetName}, updateMask: "rulesetName"}')

          released=$(curl --retry 10 --retry-all-errors --retry-delay 20 --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$patch_body" \
            "${RULES_API}/${RELEASE_NAME}")

          active_ruleset=$(printf '%s' "$released" | jq -r '.rulesetName // empty')
          if [ "$active_ruleset" != "$ruleset_name" ]; then
            echo "$released"
            echo "::error::Named Firestore release did not activate the new ruleset."
            exit 3
          fi

          verified=$(curl --retry 8 --retry-all-errors --retry-delay 15 --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${RULES_API}/${RELEASE_NAME}")
          verified_ruleset=$(printf '%s' "$verified" | jq -r '.rulesetName // empty')

          if [ "$verified_ruleset" != "$ruleset_name" ]; then
            echo "$verified"
            echo "::error::Post-deployment verification found a different active ruleset."
            exit 4
          fi

          echo "Named database rules deployment verified."
          echo "database=${FIRESTORE_DATABASE_ID}"
          echo "release=${RELEASE_NAME}"
          echo "ruleset=${ruleset_name}"
