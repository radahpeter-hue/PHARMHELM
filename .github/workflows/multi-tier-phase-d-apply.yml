name: Apply Multi Tier Phase D

on:
  push:
    branches:
      - codex/multi-tier-phase-d-20260908

permissions:
  contents: write

jobs:
  apply_validate_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: codex/multi-tier-phase-d-20260908
          fetch-depth: 2

      - name: Apply Phase D source transformation
        id: patch
        shell: bash
        run: |
          python3 scripts/apply-multi-tier-phase-d.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --check
            git diff --stat
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install @tailwindcss/oxide-linux-x64-gnu --save-optional --no-save

      - name: TypeScript validation
        run: npm run lint

      - name: Test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit validated Phase D integration
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "radahpeter-hue"
          git config user.email "peterssentongo61@gmail.com"
          git add src/pages/Sales.tsx src/services/consumptionService.ts src/services/saleInventoryIntegrityService.ts
          git commit -m "feat: integrate multi-tier transactional checkout phase d"
          git push origin HEAD:codex/multi-tier-phase-d-20260908
