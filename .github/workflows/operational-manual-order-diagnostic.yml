name: Operational Manual Order Diagnostic
on:
  push:
    branches: [fix/operational-manual-order-repair]
    paths: ['scripts/diagnose-operational-manual-order.mjs', '.github/workflows/operational-manual-order-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read Martin Pharma Operational order linkage
        run: GOOGLE_OAUTH_ACCESS_TOKEN="$(gcloud auth print-access-token)" node scripts/diagnose-operational-manual-order.mjs
