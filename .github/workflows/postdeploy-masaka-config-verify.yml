name: Postdeploy Masaka Config Verify

on:
  push:
    branches:
      - ops/postdeploy-masaka-verify

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      FIREBASE_PROJECT_ID: gen-lang-client-0911422817
      FIRESTORE_DATABASE_ID: ai-studio-f7d8654b-e089-425a-a506-38159afe1e75
      TENANT_ID: zehqTDcKyrDAOHKK3stJ
      MASAKA_BRANCH_ID: 1agW2eYBOGGqKR9w2V31
      HQ_BRANCH_ID: HSV2BIENhvRFIrxw9SWT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save firebase-admin
      - name: Authenticate Google service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - name: Verify production POS configuration read-only
        run: |
          node --input-type=module <<'EOF'
          import { applicationDefault, initializeApp } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';

          const app = initializeApp({ credential: applicationDefault(), projectId: process.env.FIREBASE_PROJECT_ID });
          const db = getFirestore(app, process.env.FIRESTORE_DATABASE_ID);
          const [tenantSnap, masakaSnap, hqSnap] = await Promise.all([
            db.collection('tenants').doc(process.env.TENANT_ID).get(),
            db.collection('branches').doc(process.env.MASAKA_BRANCH_ID).get(),
            db.collection('branches').doc(process.env.HQ_BRANCH_ID).get(),
          ]);

          if (!tenantSnap.exists || !masakaSnap.exists || !hqSnap.exists) throw new Error('Expected production configuration document missing.');
          const tenant = tenantSnap.data();
          const masaka = masakaSnap.data();
          const hq = hqSnap.data();

          const checks = {
            tenantFeatureEnabled: tenant?.features?.posCheckoutV2Enabled === true,
            tenantFallbackLegacy: tenant?.posCheckoutEngine === 'legacy',
            masakaV2: masaka?.posCheckoutEngine === 'v2',
            masakaTenantScoped: masaka?.tenantId === process.env.TENANT_ID,
            hqLegacyFallback: hq?.posCheckoutEngine == null,
            hqTenantScoped: hq?.tenantId === process.env.TENANT_ID,
          };

          for (const [name, passed] of Object.entries(checks)) {
            if (!passed) throw new Error(`Configuration check failed: ${name}`);
          }
          console.log('PASS: Martin Pharma POS engine configuration remains unchanged after deployment.');
          console.log('PASS: Masaka remains V2; HQ remains on tenant legacy fallback.');
          EOF
