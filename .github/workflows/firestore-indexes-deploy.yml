name: Deploy Firestore Indexes

on:
  push:
    branches:
      - main
    paths:
      - firestore.indexes.json
      - firebase.json

jobs:
  deploy_indexes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Deploy Firestore indexes
        env:
          FIREBASE_PROJECT_ID: gen-lang-client-0911422817
        run: npx firebase-tools deploy --only firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive
