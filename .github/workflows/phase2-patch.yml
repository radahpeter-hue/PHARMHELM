name: Phase 2 Context Validation Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/pages/Sales.tsx'
      - 'src/utils/saleContextValidation.ts'
      - 'tests/pos-phase2-context-validation.test.ts'
      - 'docs/POS_V2_PHASE2_CONTEXT_VALIDATION_REPORT.md'
      - 'scripts/applyPhase2ContextValidation.mjs'
      - '.github/workflows/phase2-patch.yml'

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/pos-v2-phase2-context-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply surgical Sales wiring
        run: node scripts/applyPhase2ContextValidation.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run targeted Phase 2 tests
        run: node --import tsx --test tests/pos-phase2-context-validation.test.ts

      - name: Run complete test suite
        id: full_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/phase2-full-tests.log

      - name: Confirm any full-suite failure is the known Phase 1 stale PDF assertion
        id: baseline_exception
        if: steps.full_tests.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          grep -q '# fail 1' /tmp/phase2-full-tests.log
          grep -q 'A4 PDF export has asset wait, image-free retry, blob download and print fallback' /tmp/phase2-full-tests.log
          grep -q "assert.ok(invoiceSource.includes('waitForInvoiceAssets(element)'))" /tmp/phase2-full-tests.log
          git show origin/main:tests/pos-phase1-ui-docs.test.ts | grep -q "waitForInvoiceAssets(element)"
          if git show origin/main:src/components/sales/A4InvoiceTemplate.tsx | grep -q "waitForInvoiceAssets(element)"; then
            echo 'Main still contains the old implementation expected by the test; this is not a baseline mismatch.' >&2
            exit 1
          fi
          echo 'Confirmed: the only full-suite failure is a stale Phase 1 assertion already present on main after PR #26.'

      - name: Run lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/phase2-lint.log

      - name: Run typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/phase2-typecheck.log

      - name: Run production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/phase2-build.log

      - name: Run git diff check
        id: diff_check
        continue-on-error: true
        run: git diff --check

      - name: Prove protected core is untouched
        id: protected_core
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          changed=$( { git diff --name-only origin/main...HEAD; git diff --name-only; } | sort -u )
          echo "$changed"
          protected='^(src/services/pos-v2/posCheckoutV2Repository.ts|src/services/pos-v2/posCheckoutV2Calculator.ts|src/services/pos-v2/posCheckoutV2Service.ts|src/services/posCheckoutTierService.ts|src/services/posTierCartService.ts|firestore.rules)$'
          if printf '%s\n' "$changed" | grep -E "$protected"; then
            echo 'Protected POS V2 transaction core or Firestore rules were modified.' >&2
            exit 1
          fi

      - name: Upload gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-gate-diagnostics
          path: |
            /tmp/phase2-full-tests.log
            /tmp/phase2-lint.log
            /tmp/phase2-typecheck.log
            /tmp/phase2-build.log
          if-no-files-found: ignore

      - name: Finalize branch with only Phase 2 product changes
        if: (steps.full_tests.outcome == 'success' || steps.baseline_exception.outcome == 'success') && steps.lint.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.build.outcome == 'success' && steps.diff_check.outcome == 'success' && steps.protected_core.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/applyPhase2ContextValidation.mjs
          rm .github/workflows/phase2-patch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Sales.tsx scripts/applyPhase2ContextValidation.mjs .github/workflows/phase2-patch.yml
          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git commit -m 'fix: wire POS context validation before checkout'
          git push origin HEAD:fix/pos-v2-phase2-context-validation

      - name: Fail if Phase 2 quality gates failed
        if: (steps.full_tests.outcome != 'success' && steps.baseline_exception.outcome != 'success') || steps.lint.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.build.outcome != 'success' || steps.diff_check.outcome != 'success' || steps.protected_core.outcome != 'success'
        run: |
          echo 'One or more Phase 2 quality gates failed beyond the confirmed pre-existing Phase 1 test mismatch.'
          exit 1
