name: Apply Multi Tier Phase E

on:
  push:
    branches:
      - codex/multi-tier-integration-cleanup-20260909

permissions:
  contents: write

jobs:
  apply_validate_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: codex/multi-tier-integration-cleanup-20260909
          fetch-depth: 2

      - name: Apply Phase E transformations
        id: patch
        run: |
          python3 scripts/apply-multi-tier-phase-e.py
          python3 scripts/fix-phase-e-validation.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --check
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install @tailwindcss/oxide-linux-x64-gnu --save-optional --no-save

      - name: TypeScript validation
        run: npm run lint

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit validated Phase E transformations
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name "radahpeter-hue"
          git config user.email "peterssentongo61@gmail.com"
          git add src tests
          git commit -m "feat: complete multi-tier phase e integration"
          git push origin HEAD:codex/multi-tier-integration-cleanup-20260909
