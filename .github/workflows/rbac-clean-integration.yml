name: Build clean RBAC integration

on:
  push:
    branches:
      - fix/rbac-role-boundaries-main-20260910
    paths:
      - .github/workflows/rbac-clean-integration.yml

permissions:
  contents: write

jobs:
  integrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current-main integration branch
        uses: actions/checkout@v4
        with:
          ref: fix/rbac-role-boundaries-main-20260910
          fetch-depth: 0

      - name: Import only validated RBAC product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/supervisor-hr-appraisal-access-20260910
          git checkout origin/codex/supervisor-hr-appraisal-access-20260910 -- \
            firestore.rules \
            src/config/rbac.ts \
            src/modules/hr/PerformanceDiscipline.tsx \
            src/modules/hr/RecruitmentManager.tsx \
            src/modules/hr/TraineesManager.tsx \
            src/modules/qa/Appraisals.tsx \
            src/modules/qa/QAModule.tsx \
            src/pages/Finance.tsx \
            src/pages/HRAdmin.tsx \
            src/types.ts \
            tests/rbac-role-boundaries.test.ts

          python - <<'PY'
          from pathlib import Path
          path = Path('firestore.rules')
          text = path.read_text()

          old_sales = "    match /sales/{saleId} {\n      allow read: if isAuthenticated() && isTenantMember(resource.data.tenantId);\n"
          new_sales = "    match /sales/{saleId} {\n      allow get: if isAuthenticated() && (resource == null || isTenantMember(resource.data.tenantId));\n      allow list: if isAuthenticated() && isTenantMember(resource.data.tenantId);\n"
          if old_sales in text:
              text = text.replace(old_sales, new_sales, 1)
          elif new_sales not in text:
              raise SystemExit('Latest main sales get/list protection could not be preserved')

          old_generic = "      allow read: if collectionName != 'opening_stock_sessions' && collectionName != 'transfer_invoices' && collectionName != 'transfer_invoice_lines' && collectionName != 'hiring_applications' && collectionName != 'practical_assessments' && collectionName != 'disciplinary_incidents' && collectionName != 'appraisals' && !isProtectedFinanceCollection(collectionName) && isAuthenticated() && isTenantMember(resource.data.tenantId);"
          new_generic = "      allow get: if collectionName != 'opening_stock_sessions' && collectionName != 'transfer_invoices' && collectionName != 'transfer_invoice_lines' && collectionName != 'hiring_applications' && collectionName != 'practical_assessments' && collectionName != 'disciplinary_incidents' && collectionName != 'appraisals' && !isProtectedFinanceCollection(collectionName) && isAuthenticated() && (resource == null || isTenantMember(resource.data.tenantId));\n      allow list: if collectionName != 'opening_stock_sessions' && collectionName != 'transfer_invoices' && collectionName != 'transfer_invoice_lines' && collectionName != 'hiring_applications' && collectionName != 'practical_assessments' && collectionName != 'disciplinary_incidents' && collectionName != 'appraisals' && !isProtectedFinanceCollection(collectionName) && isAuthenticated() && isTenantMember(resource.data.tenantId);"
          if old_generic in text:
              text = text.replace(old_generic, new_generic, 1)
          elif new_generic not in text:
              raise SystemExit('Latest main generic get/list behavior could not be combined with RBAC exclusions')

          path.write_text(text)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full regression tests
        run: npm test

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff validation
        run: git diff --check

      - name: Remove temporary workflow and commit clean tree
        shell: bash
        run: |
          git rm .github/workflows/rbac-clean-integration.yml
          git add -A
          git commit -m "fix(rbac): enforce approved role boundaries and secondary-role access"
          git push origin HEAD:fix/rbac-role-boundaries-main-20260910
