name: Validate final supervisor QA boundary

on:
  push:
    branches:
      - codex/supervisor-hr-appraisal-access-20260910
    paths:
      - .github/workflows/supervisor-final-review.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/supervisor-hr-appraisal-access-20260910
          fetch-depth: 0
      - name: Apply final QA boundary hardening
        run: python scripts/finalize-supervisor-qa-boundary.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff validation
        run: git diff --check
      - name: Commit final hardening
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/qa/QAModule.tsx
          git commit -m "fix(rbac): harden supervisor appraisal-only rendering"
          git push origin HEAD:codex/supervisor-hr-appraisal-access-20260910
