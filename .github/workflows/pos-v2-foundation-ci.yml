name: POS V2 Foundation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/services/pos-v2/**'
      - 'scripts/pos-v2-batch4-core.mjs'
      - 'scripts/process-pos-v2-outbox.mjs'
      - 'scripts/verify-active-firestore-rules.sh'
      - 'tests/pos-checkout-v2-*.test.ts'
      - 'tests/firebase-deploy-rules-drift.test.ts'
      - 'src/services/posCheckoutTierService.ts'
      - 'src/services/sellingTierService.ts'
      - 'src/types.ts'
      - 'src/types/sellingTier.ts'
      - 'firestore.rules'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pos-v2-foundation-ci.yml'
      - '.github/workflows/pos-v2-batch4-outbox.yml'
      - '.github/workflows/firebase-deploy.yml'

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Authenticate for hosted Firestore rules compilation
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Validate rules with the hosted Firebase compiler
        shell: bash
        env:
          FIREBASE_PROJECT_ID: gen-lang-client-0911422817
        run: |
          set -euo pipefail

          access_token=$(gcloud auth application-default print-access-token)
          test_body=$(jq -n --rawfile rules firestore.rules \
            '{source: {files: [{name: "firestore.rules", content: $rules}]}}')

          response=$(curl --retry 2 --retry-all-errors --retry-delay 10 \
            --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${access_token}" \
            -H "Content-Type: application/json" \
            --data "$test_body" \
            "https://firebaserules.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}:test")

          errors=$(printf '%s' "$response" | jq '[.issues[]? | select(.severity == "ERROR")] | length')
          if [ "$errors" -ne 0 ]; then
            printf '%s\n' "$response" | jq .
            echo "::error title=Hosted Firestore rules compilation failed::Firebase rejected the proposed rules."
            exit 1
          fi

          echo "Hosted Firebase compiler accepted firestore.rules."
