name: Management Cash settlement acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/services/managementCashPosting.ts'
      - 'src/services/managementPaymentAccountService.ts'
      - 'src/services/cashGrnSettlementService.ts'
      - 'src/components/finance/**'
      - 'scripts/management-cash-settlement-*.mjs'
      - 'scripts/validate-inactive-finance-rules.mjs'
      - 'scripts/firestore-unbound-probe.mjs'
      - '.github/workflows/management-cash-settlement-checks.yml'
      - 'firestore.rules'
      - 'scripts/build-firestore-release-rules.mjs'
permissions:
  contents: read
jobs:
  authenticated-settlement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Compile equivalent rules before authenticated tests and release-size validation
        run: node scripts/build-firestore-release-rules.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false --ignore-scripts firebase-tools@15.4.0
      - name: Authenticated Cash/Bank settlement and competing writer tests
        run: npx firebase emulators:exec --only firestore --project pharmhelm-finance-settlement-rules "node scripts/management-cash-settlement-rules-emulator.mjs"
      - name: Install isolated mobile verification browser
        if: always()
        run: |
          npm install --prefix /tmp/finance-browser --no-save playwright@1.51.1
          /tmp/finance-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual supplier payment and account UI at phone widths
        if: always()
        env:
          PLAYWRIGHT_MODULE: /tmp/finance-browser/node_modules/playwright
        run: node scripts/management-cash-settlement-ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: management-payment-mobile-proof
          path: /tmp/management-payment-ui-*/*.png
      - name: Authenticate inactive ruleset validation
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        id: inactive_rules_auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - name: Set up Google Cloud CLI
        if: success() && steps.inactive_rules_auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v3
      - name: Verify candidate rules against the active named database
        id: active_rules
        if: success() && steps.inactive_rules_auth.outcome == 'success'
        continue-on-error: true
        env:
          FIREBASE_PROJECT_ID: gen-lang-client-0911422817
          FIRESTORE_DATABASE_ID: ai-studio-f7d8654b-e089-425a-a506-38159afe1e75
        run: bash scripts/verify-active-firestore-rules.sh
      - name: Verify compiled release limits without activating rules
        if: success() && steps.inactive_rules_auth.outcome == 'success' && steps.active_rules.outcome != 'success'
        run: node scripts/validate-inactive-finance-rules.mjs
