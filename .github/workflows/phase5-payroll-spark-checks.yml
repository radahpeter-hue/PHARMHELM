name: Phase 5 Payroll Spark validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate release rules transformation
        run: node scripts/build-firestore-release-rules.mjs
      - name: Install Firebase emulator tools
        run: npm install --no-save --package-lock=false --ignore-scripts firebase-tools@15.4.0
      - name: Authenticated payroll and advance rule denials
        env:
          PHASE5_TEST_COMMIT: '${{ github.event.pull_request.head.sha || github.sha }}'
        run: npx firebase emulators:exec --only firestore --project phase5-advance-rules "node scripts/phase5-authority-audit-emulator.mjs && node --import tsx scripts/phase5-advance-rules-emulator.mjs && node --import tsx scripts/phase5-financial-reconciliation-emulator.mjs"
      - name: Install isolated salary UI browser
        run: |
          npm install --prefix /tmp/phase5-browser --no-save --ignore-scripts playwright
          /tmp/phase5-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Salary payment preview and retry at phone widths
        env:
          PLAYWRIGHT_MODULE: /tmp/phase5-browser/node_modules/playwright
        run: node scripts/phase5-salary-ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-salary-mobile-proof
          path: /tmp/phase5-salary-ui-*/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-martin-financial-evidence
          path: /tmp/phase5-martin-financial-acceptance.json
