name: Phase 2 Context Validation Implementation

on:
  push:
    branches:
      - "fix/pos-v2-phase2-context-validation"

permissions:
  contents: write

jobs:
  phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Wire validator into Sales
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/pages/Sales.tsx")
          s = p.read_text()
          anchor = "import { canOperatePos, formatPosCheckoutError } from '../utils/posAuthorization';"
          added = "import { validateSaleCheckoutContext } from '../utils/saleContextValidation';"
          if added not in s:
              if anchor not in s:
                  raise SystemExit("posAuthorization import anchor missing")
              s = s.replace(anchor, anchor + "\n" + added, 1)

          old = """    // Validation based on context
    if (context === 'telepharmacy' && !selectedPatient) {
      toast.error('Patient is mandatory for Telepharmacy');
      return;
    }
    if (context === 'institutional' && !selectedInstitution) {
      toast.error('Institution is mandatory for Institutional billing');
      return;
    }
"""
          new = """    const contextValidation = validateSaleCheckoutContext({
      context,
      paymentMethod,
      hasPatient: Boolean(selectedPatient),
      hasInstitution: Boolean(selectedInstitution)
    });
    if (!contextValidation.valid) {
      toast.error(contextValidation.message);
      return;
    }
"""
          if old in s:
              s = s.replace(old, new, 1)

          complete_anchor = """    if (!editingSaleId && !activeBranchId) {
      receiptWindow?.close();
      toast.error('Select an active branch before processing a sale.');
      return;
    }

    // Check if any cart item's price is below cost price of that specific batch
"""
          complete_new = """    if (!editingSaleId && !activeBranchId) {
      receiptWindow?.close();
      toast.error('Select an active branch before processing a sale.');
      return;
    }

    const contextValidation = validateSaleCheckoutContext({
      context,
      paymentMethod,
      hasPatient: Boolean(selectedPatient),
      hasInstitution: Boolean(selectedInstitution)
    });
    if (!contextValidation.valid) {
      receiptWindow?.close();
      toast.error(contextValidation.message);
      return;
    }

    // Check if any cart item's price is below cost price of that specific batch
"""
          if complete_anchor in s:
              s = s.replace(complete_anchor, complete_new, 1)

          if s.count("const contextValidation = validateSaleCheckoutContext({") != 2:
              raise SystemExit("expected exactly two Phase 2 validation boundaries")
          p.write_text(s)
      - name: Install dependencies
        run: npm ci
      - name: Targeted Phase 2 tests
        run: node --import tsx --test tests/pos-phase2-context-validation.test.ts
      - name: Full tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Protected core check
        shell: bash
        run: |
          if git diff --name-only HEAD | grep -E '^(src/services/pos-v2/posCheckoutV2Repository.ts|src/services/pos-v2/posCheckoutV2Calculator.ts|src/services/pos-v2/posCheckoutV2Service.ts|src/services/posCheckoutTierService.ts|src/services/posTierCartService.ts|firestore.rules)$'; then
            echo "Protected POS V2 core changed" >&2
            exit 1
          fi
      - name: Commit Sales wiring
        shell: bash
        run: |
          if git diff --quiet -- src/pages/Sales.tsx; then
            echo "Sales wiring already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Sales.tsx
          git commit -m "fix: validate POS sale context before checkout"
          git push origin HEAD:"fix/pos-v2-phase2-context-validation"
