name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: gen-lang-client-0911422817
      FIRESTORE_DATABASE_ID: ai-studio-f7d8654b-e089-425a-a506-38159afe1e75
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install @tailwindcss/oxide-linux-x64-gnu --save-optional --no-save

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Build project
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          echo "Building commit ${VITE_BUILD_SHA} at ${VITE_BUILD_TIME}"
          npm run lint
          npm run build
          node scripts/build-firestore-release-rules.mjs

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Check active Firestore rules fingerprint
        id: firestore_rules_state
        continue-on-error: true
        shell: bash
        run: bash scripts/verify-active-firestore-rules.sh

      - name: Report Firestore rules drift or unavailable verification
        if: steps.firestore_rules_state.outcome == 'failure'
        run: |
          echo "::warning title=Firestore rules deployment required::The active named-database rules do not match this commit, or Firebase could not verify them. Deployment will proceed and Hosting remains blocked until exact post-deployment verification succeeds."

      - name: Deploy Firestore rules
        if: steps.firestore_rules_state.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          # Reuse CI's fail-closed exact-source recovery and hosted size verification.
          # Source persistence alone never authorizes activation.
          node scripts/validate-inactive-finance-rules.mjs | tee /tmp/verified-release.log
          ruleset_name=$(node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const entries=readFileSync("/tmp/verified-release.log","utf8").split("\n").filter(line=>line.startsWith("{")).map(line=>JSON.parse(line));
            const verified=entries.filter(entry=>entry.mode==="UNBOUND_RELEASE_SIZE_VALIDATION");
            if(verified.length!==1 || !/^projects\/gen-lang-client-0911422817\/rulesets\/[a-zA-Z0-9_-]+$/.test(verified[0].ruleset))throw Error("No exact verified candidate.");
            process.stdout.write(verified[0].ruleset);
          ')
          FIREBASE_ACCESS_TOKEN=$(gcloud auth application-default print-access-token)
          RELEASE_NAME="projects/${FIREBASE_PROJECT_ID}/releases/cloud.firestore/${FIRESTORE_DATABASE_ID}"
          patch_body=$(jq -n --arg name "$RELEASE_NAME" --arg rulesetName "$ruleset_name" \
            '{release: {name: $name, rulesetName: $rulesetName}, updateMask: "rulesetName"}')
          curl --retry 4 --retry-all-errors --retry-delay 10 --fail-with-body --silent --show-error \
            -X PATCH -H "Authorization: Bearer ${FIREBASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" --data "$patch_body" \
            "https://firebaserules.googleapis.com/v1/${RELEASE_NAME}" > /tmp/activated-release.json
          jq -e --arg name "$RELEASE_NAME" --arg ruleset "$ruleset_name" \
            '.name == $name and .rulesetName == $ruleset' /tmp/activated-release.json
          echo "Verified candidate activated; exact active-source verification follows."

      - name: Verify exact active Firestore rules fingerprint
        shell: bash
        run: bash scripts/verify-active-firestore-rules.sh

      - name: Deploy Firestore indexes
        shell: bash
        run: |
          set -euo pipefail
          create_revision_index() {
            local output status
            set +e
            output=$(gcloud firestore indexes composite create \
              --project="$FIREBASE_PROJECT_ID" \
              --database="$FIRESTORE_DATABASE_ID" \
              --collection-group=pos_sale_revision_requests \
              --query-scope=collection \
              "$@" --async --quiet 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ "$status" -eq 0 ] || echo "$output" | grep -Eqi 'already exists|ALREADY_EXISTS'; then
              return 0
            fi
            return "$status"
          }
          create_revision_index \
            --field-config=field-path=tenantId,order=ascending \
            --field-config=field-path=originalTimestamp,order=descending
          create_revision_index \
            --field-config=field-path=tenantId,order=ascending \
            --field-config=field-path=branchId,order=ascending \
            --field-config=field-path=originalTimestamp,order=descending
          # Pending Stock In movement recovery is strictly tenant + branch scoped.
          set +e
          stockin_index_output=$(gcloud firestore indexes composite create \
            --project="$FIREBASE_PROJECT_ID" \
            --database="$FIRESTORE_DATABASE_ID" \
            --collection-group=sellable_receipt_movement_outbox \
            --query-scope=collection \
            --field-config=field-path=tenantId,order=ascending \
            --field-config=field-path=branchId,order=ascending \
            --async --quiet 2>&1)
          stockin_index_status=$?
          set -e
          echo "$stockin_index_output"
          if [ "$stockin_index_status" -ne 0 ] && ! echo "$stockin_index_output" | grep -Eqi 'already exists|ALREADY_EXISTS'; then
            echo "::error title=Stock In reconciliation index failed::Deployment stopped before Hosting."
            exit "$stockin_index_status"
          fi


      - name: Verify revision-ledger indexes are ready
        timeout-minutes: 15
        run: node scripts/verify-pos-v2-revision-indexes.mjs

      - name: Deploy Firebase Storage rules
        id: deploy_storage
        continue-on-error: true
        run: npx firebase-tools deploy --only storage --project gen-lang-client-0911422817 --non-interactive

      - name: Report deferred Firebase Storage deployment
        if: steps.deploy_storage.outcome == 'failure'
        run: |
          echo "::warning title=Firebase Storage deployment deferred::Storage rules were not deployed because Cloud Storage is unavailable on the current Spark plan. Firestore and Hosting deployment will continue."

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: gen-lang-client-0911422817
