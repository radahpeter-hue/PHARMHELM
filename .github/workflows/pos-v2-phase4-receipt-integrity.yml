name: POS V2 Phase 4 Receipt Integrity

on:
  push:
    branches:
      - fix/pos-v2-phase4-receipt-integrity
    paths:
      - 'scripts/apply-phase4-receipt-integrity-v2.mjs'
      - '.github/workflows/pos-v2-phase4-receipt-integrity.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/pos-v2-phase4-receipt-integrity

      - name: Apply narrow receipt-integrity patch
        run: node scripts/apply-phase4-receipt-integrity-v2.mjs

      - name: Remove temporary patch machinery and diagnostics
        run: |
          rm -f scripts/apply-phase4-receipt-integrity.mjs
          rm -f scripts/apply-phase4-receipt-integrity-v2.mjs
          rm -f docs/PHASE4_PATCH_ERROR.txt
          rm -f .github/workflows/pos-v2-phase4-receipt-integrity.yml

      - name: Install dependencies
        run: npm ci

      - name: Run focused receipt presentation tests
        run: node --import tsx --test tests/sale-presentation.test.ts

      - name: TypeScript validation
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify protected POS V2 engine is unchanged
        run: |
          git diff --exit-code 93bcc417a5756760aa6b6733b8e11ea0628c66d9 -- \
            src/services/pos-v2/posCheckoutV2Repository.ts \
            src/services/pos-v2/posCheckoutV2Calculator.ts \
            src/services/pos-v2/posCheckoutV2Service.ts

      - name: Commit validated Phase 4 repair
        run: |
          git config user.name "PharmHelm CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore POS V2 receipt identity and seller attribution"
          git push origin HEAD:fix/pos-v2-phase4-receipt-integrity
