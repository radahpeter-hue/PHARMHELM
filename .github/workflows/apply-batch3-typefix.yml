name: Apply Batch 3 Type Fix

on:
  push:
    branches:
      - main

jobs:
  apply_fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply Batch 3 TypeScript fix once
        shell: bash
        run: |
          set -e
          if [ ! -f scripts/fix_batch3_types.py ]; then
            echo "Batch 3 TypeScript fix already applied."
            exit 0
          fi
          python3 scripts/fix_batch3_types.py
          rm scripts/fix_batch3_types.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Sales.tsx scripts/fix_batch3_types.py
          git commit -m "fix: correct batch 3 TypeScript product IDs"
          git push origin HEAD:main
