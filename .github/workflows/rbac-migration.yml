name: Apply RBAC migration

on:
  push:
    branches:
      - codex/rbac-system-custom-roles-20260908
    paths:
      - scripts/apply-rbac-migration.py
      - .github/workflows/rbac-migration.yml

permissions:
  contents: write

jobs:
  apply-rbac:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/rbac-system-custom-roles-20260908
          fetch-depth: 0

      - name: Apply migration patch
        run: python scripts/apply-rbac-migration.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Commit patched files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contexts/AuthContext.tsx src/pages/Settings.tsx src/modules/hr/StaffDirectory.tsx firestore.rules
          git commit -m "feat(rbac): integrate system and custom role authorization"
          git push origin HEAD:codex/rbac-system-custom-roles-20260908
