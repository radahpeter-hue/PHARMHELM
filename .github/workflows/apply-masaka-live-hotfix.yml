name: Masaka Hotfix Verifier

on:
  push:
    branches:
      - fix/masaka-pos-v2-live-failures

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Align live patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_masaka_live_hotfix.py')
          text = p.read_text()
          text = text.replace('errorMessage: null', 'lastError: null')
          old = '"                          </div>\\n                        </td>\\n                      </tr>",\n    "                            </div>\\n                          )}\\n                        </td>\\n                      </tr>",'
          new = '"                              <Trash2 size={16} />\\n                            </button>\\n                          </div>\\n                        </td>\\n                      </tr>",\n    "                              <Trash2 size={16} />\\n                            </button>\\n                            </div>\\n                          )}\\n                        </td>\\n                      </tr>",'
          if old not in text:
              raise SystemExit('Inventory action patch anchor definition not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - run: python3 scripts/apply_masaka_live_hotfix.py
      - name: Cover stockcard last-sale date
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/inventory/ProductStockcard.tsx')
          text = p.read_text()
          old = "format(new Date(movements.find(m => m.movementClass === 'sale' || m.class === 'sale')!.timestamp), 'MMM dd, yyyy')"
          new = "formatDateValue(movements.find(m => m.movementClass === 'sale' || m.class === 'sale')!.timestamp, 'MMM dd, yyyy')"
          if old not in text:
              raise SystemExit('Stockcard Last Sale date anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Remove trailing whitespace introduced by hotfix blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'src/components/inventory/ProductStockcard.tsx': [
                  ('                              <button \n', '                              <button\n'),
              ],
              'src/pages/Inventory.tsx': [
                  ('          <TabButton \n', '          <TabButton\n'),
                  ("            active={activeTab === 'stock'} \n", "            active={activeTab === 'stock'}\n"),
                  ("            onClick={() => setActiveTab('stock')} \n", "            onClick={() => setActiveTab('stock')}\n"),
                  ('            label="Stock Adjustments" \n', '            label="Stock Adjustments"\n'),
                  ('            icon={<Activity size={16} />} \n', '            icon={<Activity size={16} />}\n'),
                  ('                  <button \n', '                  <button\n'),
              ],
          }
          for filename, pairs in replacements.items():
              p = Path(filename)
              text = p.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Whitespace cleanup anchor not found in {filename}: {old!r}')
                  text = text.replace(old, new, 1)
              p.write_text(text)
          PY
      - name: Use repository test harness
        run: |
          cat > tests/live-pos-inventory-regressions.test.ts <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { omitUndefinedDeep } from '../src/utils/firestoreData';
          import { formatDateValue, normalizeDateValue } from '../src/utils/dateValue';

          const root = process.cwd();
          const read = (relative: string) => fs.readFileSync(path.join(root, relative), 'utf8');

          test('normalizes Firestore Timestamp-like values and rejects invalid dates', () => {
            const fromToDate = normalizeDateValue({ toDate: () => new Date('2027-01-31T00:00:00.000Z') });
            assert.equal(fromToDate?.toISOString(), '2027-01-31T00:00:00.000Z');
            assert.equal(normalizeDateValue({ seconds: 1_800_000_000 })?.getTime(), 1_800_000_000_000);
            assert.equal(normalizeDateValue('not-a-date'), null);
            assert.equal(formatDateValue('not-a-date', 'MMM dd, yyyy'), 'Invalid date');
          });

          test('removes undefined deeply while preserving null, Date and class instances', () => {
            class Sentinel { constructor(public value: number) {} }
            const date = new Date('2026-09-29T00:00:00.000Z');
            const sentinel = new Sentinel(7);
            const result = omitUndefinedDeep({ keep: null, remove: undefined, nested: { remove: undefined, keep: 1 }, array: [1, undefined, { remove: undefined, keep: 2 }], date, sentinel });
            assert.deepEqual(result, { keep: null, nested: { keep: 1 }, array: [1, { keep: 2 }], date, sentinel });
            assert.equal(result.date, date);
            assert.equal(result.sentinel, sentinel);
          });

          test('uses the authoritative active branch in the POS card', () => {
            const sales = read('src/pages/Sales.tsx');
            assert.ok(sales.includes("activeBranch?.name || 'No branch selected'"));
            assert.ok(!sales.includes("profile?.branch || 'Main Branch'"));
          });

          test('separates inventory view access from operational controls', () => {
            const inventory = read('src/pages/Inventory.tsx');
            const stockcard = read('src/components/inventory/ProductStockcard.tsx');
            assert.ok(inventory.includes("const canOperateInventory = hasPermission('inventory', 'operate')"));
            assert.ok(inventory.includes('{canOperateInventory && ('));
            assert.ok(stockcard.includes("const canOperateInventory = hasPermission('inventory', 'operate')"));
            assert.ok(stockcard.includes('canOperateInventory && adjustingBatch'));
            assert.ok(!stockcard.includes('format(new Date('));
          });

          test('sanitizes POS V2 writes and normalizes batch expiry values', () => {
            const repo = read('src/services/pos-v2/posCheckoutV2Repository.ts');
            assert.ok(repo.includes('omitUndefinedDeep({'));
            assert.ok(repo.includes('omitUndefinedDeep(attempt)'));
            assert.ok(repo.includes('normalizeDateValue(batch.expiryDate)?.toISOString() ?? null'));
          });
          EOF
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply_masaka_live_hotfix.py
          rm -f .github/workflows/apply-masaka-live-hotfix.yml
          rm -f .github/workflows/apply-masaka-live-hotfix-v2.yml
          git add -A
          git commit -m "fix: harden Masaka POS and inventory live flows"
          git push origin HEAD:fix/masaka-pos-v2-live-failures
