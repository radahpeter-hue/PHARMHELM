name: Phase 5 Payroll Spark validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate release rules transformation
        run: node scripts/build-firestore-release-rules.mjs
      - name: Install Firebase emulator tools
        run: npm install --no-save --package-lock=false --ignore-scripts firebase-tools@15.4.0
